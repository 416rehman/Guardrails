[workspace]
resolver = "3"
members = ["crates/*", "programs/*"]
exclude = ["bpf/grdr-sensor-linux-bpf"]

[workspace.dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.23"
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["fast"] }
futures-util = "0.3"
getrandom = "0.4"
grdr-agents = { version = "0.1.0", path = "crates/grdr-agents" }
grdr-core = { version = "0.1.0", path = "crates/grdr-core" }
grdr-crypto = { version = "0.1.0", path = "crates/grdr-crypto" }
grdr-fastpath = { version = "0.1.0", path = "crates/grdr-fastpath" }
grdr-model = { version = "0.1.0", path = "crates/grdr-model" }
grdr-store-local = { version = "0.1.0", path = "crates/grdr-store-local" }
jiff = { version = "0.2", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "charset"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
exit = "deny"
