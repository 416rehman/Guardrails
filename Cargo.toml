[workspace]
resolver = "3"
members = ["crates/*", "programs/*"]
exclude = ["bpf/grdr-sensor-linux-bpf", "desktop/grdr-desktop"]

[workspace.dependencies]
axum = { version = "0.8", features = ["json", "macros"] }
base64 = "0.23"
cedar-policy = "4.15"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
clap = { version = "4.5", features = ["derive", "env"] }
ed25519-dalek = { version = "3.0", default-features = false, features = ["fast"] }
futures-util = "0.3"
getrandom = "0.4"
grdr-agents = { version = "0.1.0", path = "crates/grdr-agents" }
grdr-blob = { version = "0.1.0", path = "crates/grdr-blob" }
grdr-broker = { version = "0.1.0", path = "crates/grdr-broker" }
grdr-bus-log = { version = "0.1.0", path = "crates/grdr-bus-log" }
grdr-compat = { version = "0.1.0", path = "crates/grdr-compat" }
grdr-core = { version = "0.1.0", path = "crates/grdr-core" }
grdr-crypto = { version = "0.1.0", path = "crates/grdr-crypto" }
grdr-export = { version = "0.1.0", path = "crates/grdr-export" }
grdr-fastpath = { version = "0.1.0", path = "crates/grdr-fastpath" }
grdr-fastpath-ffi = { version = "0.1.0", path = "crates/grdr-fastpath-ffi" }
grdr-ffi = { version = "0.1.0", path = "crates/grdr-ffi" }
grdr-jobs = { version = "0.1.0", path = "crates/grdr-jobs" }
grdr-llm-proto = { version = "0.1.0", path = "crates/grdr-llm-proto" }
grdr-mcp-proto = { version = "0.1.0", path = "crates/grdr-mcp-proto" }
grdr-messages = { version = "0.1.0", path = "crates/grdr-messages" }
grdr-model = { version = "0.1.0", path = "crates/grdr-model" }
grdr-ports = { version = "0.1.0", path = "crates/grdr-ports" }
grdr-ports-testkit = { version = "0.1.0", path = "crates/grdr-ports-testkit" }
grdr-proto = { version = "0.1.0", path = "crates/grdr-proto" }
grdr-rel-sqlite = { version = "0.1.0", path = "crates/grdr-rel-sqlite" }
grdr-review = { version = "0.1.0", path = "crates/grdr-review" }
grdr-sandbox-engine = { version = "0.1.0", path = "crates/grdr-sandbox-engine" }
grdr-schema = { version = "0.1.0", path = "crates/grdr-schema" }
grdr-sensor-linux = { version = "0.1.0", path = "crates/grdr-sensor-linux" }
grdr-store-local = { version = "0.1.0", path = "crates/grdr-store-local" }
grdr-strings = { version = "0.1.0", path = "crates/grdr-strings" }
grdr-ui-model = { version = "0.1.0", path = "crates/grdr-ui-model" }
grdr-wasm = { version = "0.1.0", path = "crates/grdr-wasm" }
grdr-wire = { version = "0.1.0", path = "crates/grdr-wire" }
jiff = { version = "1.0", features = ["serde"] }
prost = { version = "0.13", default-features = false, features = ["derive", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "charset"] }
rusqlite = { version = "0.43", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.11", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
exit = "deny"
