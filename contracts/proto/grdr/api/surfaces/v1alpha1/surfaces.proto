// Service interface for SurfaceService.
service SurfaceService {
  // Invokes ExplainReceipt.
  rpc ExplainReceipt(ExplainReceiptRequest) returns (ExplainReceiptResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "overview:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes ListReviewQueue.
  rpc ListReviewQueue(ListReviewQueueRequest) returns (ListReviewQueueResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "review:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes DecideReviewCluster.
  rpc DecideReviewCluster(DecideReviewClusterRequest) returns (DecideReviewClusterResponse) {
    option (grdr.common.v1alpha1.scope) = "review:write";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_INTERACTIVE;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_CONSEQUENCE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes GetComplianceWorkspace.
  rpc GetComplianceWorkspace(GetComplianceWorkspaceRequest) returns (GetComplianceWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "compliance:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes UpdateCompliancePolicy.
  rpc UpdateCompliancePolicy(UpdateCompliancePolicyRequest) returns (UpdateCompliancePolicyResponse) {
    option (grdr.common.v1alpha1.scope) = "compliance:write";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_CRITICAL_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_CRITICAL;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_PROPOSE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes CreateLegalHold.
  rpc CreateLegalHold(CreateLegalHoldRequest) returns (CreateLegalHoldResponse) {
    option (grdr.common.v1alpha1.scope) = "compliance:hold";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_CRITICAL_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_CRITICAL;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_CONSEQUENCE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes ApproveLegalHold.
  rpc ApproveLegalHold(ApproveLegalHoldRequest) returns (ApproveLegalHoldResponse) {
    option (grdr.common.v1alpha1.scope) = "compliance:hold";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_CRITICAL_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_CRITICAL;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_QUORUM;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes ExportComplianceArtifact.
  rpc ExportComplianceArtifact(ExportComplianceArtifactRequest) returns (ExportComplianceArtifactResponse) {
    option (grdr.common.v1alpha1.scope) = "compliance:export";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_SENSITIVE_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_BULK;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes PushGrcEvidence.
  rpc PushGrcEvidence(PushGrcEvidenceRequest) returns (PushGrcEvidenceResponse) {
    option (grdr.common.v1alpha1.scope) = "compliance:export";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_INTERACTIVE;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_CONSEQUENCE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes RequestReidentification.
  rpc RequestReidentification(RequestReidentificationRequest) returns (RequestReidentificationResponse) {
    option (grdr.common.v1alpha1.scope) = "privacy:quorum";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_CRITICAL_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_CRITICAL;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_PROPOSE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes ApproveReidentification.
  rpc ApproveReidentification(ApproveReidentificationRequest) returns (ApproveReidentificationResponse) {
    option (grdr.common.v1alpha1.scope) = "privacy:quorum";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_CRITICAL_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_CRITICAL;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_QUORUM;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes CompleteFirstRun.
  rpc CompleteFirstRun(CompleteFirstRunRequest) returns (CompleteFirstRunResponse) {
    option (grdr.common.v1alpha1.scope) = "policy:write";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_INTERACTIVE;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_CONSEQUENCE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes GetProviderWorkspace.
  rpc GetProviderWorkspace(GetProviderWorkspaceRequest) returns (GetProviderWorkspaceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "provider:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes SwitchProviderOrg.
  rpc SwitchProviderOrg(SwitchProviderOrgRequest) returns (SwitchProviderOrgResponse) {
    option (grdr.common.v1alpha1.scope) = "provider:act_as";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_SENSITIVE_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_INTERACTIVE;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_CONSEQUENCE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
  // Invokes AdvanceProviderRing.
  rpc AdvanceProviderRing(AdvanceProviderRingRequest) returns (AdvanceProviderRingResponse) {
    option (grdr.common.v1alpha1.scope) = "provider:write";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_CRITICAL_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_CRITICAL;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_PROPOSE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }
}
