// Operator administration plane: staged runtime config revisions, compat preflight, target health, and backup/restore drills (D-70).
syntax = "proto3";

package grdr.api.operator.v1alpha1;

import "grdr/common/v1alpha1/types.proto";

message OperatorRuntimeConfig {
  string revision_id = 1;
  uint64 version = 2;
  string capture_level = 3;
  string privacy_profile = 4;
  string retention_preset = 5;
  uint32 hot_days = 6;
  uint32 activity_days = 7;
  uint32 decision_days = 8;
  uint32 audit_days = 9;
  bool otlp_enabled = 10;
  string release_channel = 11;
  string summary = 12;
}

message ConfigDiffEntry {
  string field = 1;
  string previous = 2;
  string next = 3;
}

message ConfigRevisionEntry {
  string revision_id = 1;
  uint64 version = 2;
  string state = 3;
  string author = 4;
  string summary = 5;
  string created_at = 6;
  optional string applied_at = 7;
  repeated ConfigDiffEntry diff_lines = 8;
  OperatorRuntimeConfig config = 9;
}

message CompatCheckEntry {
  string component = 1;
  string current_version = 2;
  string target_version = 3;
  string supported_range = 4;
  string status = 5;
  repeated string agreed_capabilities = 6;
  repeated string warnings = 7;
  string remediation = 8;
}

message TargetHealthEntry {
  string id = 1;
  string name = 2;
  uint32 tier = 3;
  string kind = 4;
  string status = 5;
  string circuit_state = 6;
  uint32 failure_count = 7;
  uint32 latency_ms = 8;
  string detail = 9;
  string last_checked_at = 10;
}

message BackupDrillRecord {
  string drill_id = 1;
  string kind = 2;
  string status = 3;
  string snapshot_digest = 4;
  uint32 record_count = 5;
  uint32 verified_tables = 6;
  uint32 duration_ms = 7;
  string executed_at = 8;
  string actor = 9;
  string note = 10;
}

message GetOperatorStateRequest {}

message GetOperatorStateResponse {
  OperatorRuntimeConfig runtime_config = 1;
  repeated ConfigRevisionEntry revisions = 2;
  repeated CompatCheckEntry preflight_matrix = 3;
  string target_version = 4;
  bool overall_compatible = 5;
  repeated TargetHealthEntry targets = 6;
  repeated BackupDrillRecord drills = 7;
  grdr.common.v1alpha1.RevisionMeta revision = 8;
}

message StageConfigRevisionRequest {
  string capture_level = 1;
  string privacy_profile = 2;
  string retention_preset = 3;
  bool otlp_enabled = 4;
  string release_channel = 5;
  string summary = 6;
}

message StageConfigRevisionResponse {
  ConfigRevisionEntry revision = 1;
}

message ApplyConfigRevisionRequest {
  string revision_id = 1;
}

message ApplyConfigRevisionResponse {
  OperatorRuntimeConfig runtime_config = 1;
  ConfigRevisionEntry applied_revision = 2;
}

message RollbackConfigRevisionRequest {
  optional string target_revision_id = 1;
  string reason = 2;
}

message RollbackConfigRevisionResponse {
  OperatorRuntimeConfig runtime_config = 1;
  ConfigRevisionEntry rolled_back_revision = 2;
}

message RunUpgradePreflightRequest {
  string target_version = 1;
}

message RunUpgradePreflightResponse {
  string target_version = 1;
  bool overall_compatible = 2;
  repeated CompatCheckEntry preflight_matrix = 3;
}

message ResetTargetBreakerRequest {
  string target_id = 1;
}

message ResetTargetBreakerResponse {
  TargetHealthEntry target = 1;
}

message RunBackupDrillRequest {
  string kind = 1;
  optional string note = 2;
}

message RunBackupDrillResponse {
  BackupDrillRecord drill = 1;
}

service OperatorService {
  rpc GetOperatorState(GetOperatorStateRequest) returns (GetOperatorStateResponse);
  rpc StageConfigRevision(StageConfigRevisionRequest) returns (StageConfigRevisionResponse);
  rpc ApplyConfigRevision(ApplyConfigRevisionRequest) returns (ApplyConfigRevisionResponse);
  rpc RollbackConfigRevision(RollbackConfigRevisionRequest) returns (RollbackConfigRevisionResponse);
  rpc RunUpgradePreflight(RunUpgradePreflightRequest) returns (RunUpgradePreflightResponse);
  rpc ResetTargetBreaker(ResetTargetBreakerRequest) returns (ResetTargetBreakerResponse);
  rpc RunBackupDrill(RunBackupDrillRequest) returns (RunBackupDrillResponse);
}
