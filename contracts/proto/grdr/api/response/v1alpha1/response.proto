// Step-up approval decisions, findings triage, correlated incidents, kill switch, and audit log.
syntax = "proto3";

package grdr.api.response.v1alpha1;

import "grdr/common/v1alpha1/options.proto";
import "grdr/common/v1alpha1/enums.proto";
import "grdr/common/v1alpha1/resources.proto";
import "grdr/common/v1alpha1/types.proto";

// Request for ListApprovals using AIP-158 cursor pagination and AIP-160 filters.
message ListApprovalsRequest {
  // Requested page size (default 50, maximum 1000).
  uint32 page_size = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AEAD-sealed opaque page cursor token.
  string page_token = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Bounded AIP-160 filter expression over filterable ApprovalRequest fields.
  string filter = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Sort specification over sortable ApprovalRequest fields.
  string order_by = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Response for ListApprovals.
message ListApprovalsResponse {
  // Current page of approval requests.
  repeated grdr.common.v1alpha1.ApprovalRequest approvals = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AIP-158 cursor pagination metadata.
  grdr.common.v1alpha1.PageInfo page_info = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for DecideApproval.
message DecideApprovalRequest {
  reserved 900 to 999;

  // Approval request identifier.
  string id = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // True to approve and issue a signed grant; false to deny.
  bool approve = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Grant scope when approved.
  optional grdr.common.v1alpha1.GrantScope scope = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Optional rationale note stored on the decision and grant.
  optional string note = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_CONTENT, (grdr.common.v1alpha1.content_kind) = CONTENT_KIND_BODY, (grdr.common.v1alpha1.sealable) = true];
  // Optional actor attribution.
  optional string actor = 5 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_IDENTIFIER, (grdr.common.v1alpha1.sealable) = true];
}

// Response for DecideApproval.
message DecideApprovalResponse {
  // Updated approval request after operator decision.
  grdr.common.v1alpha1.ApprovalRequest approval = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for ListFindings using AIP-158 cursor pagination and AIP-160 filters.
message ListFindingsRequest {
  // Requested page size (default 50, maximum 1000).
  uint32 page_size = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AEAD-sealed opaque page cursor token.
  string page_token = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Bounded AIP-160 filter expression over filterable Finding fields.
  string filter = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Sort specification over sortable Finding fields.
  string order_by = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Response for ListFindings.
message ListFindingsResponse {
  // Current page of security findings.
  repeated grdr.common.v1alpha1.Finding findings = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AIP-158 cursor pagination metadata.
  grdr.common.v1alpha1.PageInfo page_info = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for UpdateFinding.
message UpdateFindingRequest {
  // Finding identifier.
  string id = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Target lifecycle transition state.
  grdr.common.v1alpha1.FindingLifecycle lifecycle = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_DERIVED];
  // Optional triage note recorded in audit logs.
  optional string note = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_CONTENT, (grdr.common.v1alpha1.content_kind) = CONTENT_KIND_BODY, (grdr.common.v1alpha1.sealable) = true];
  reserved 900 to 999;
}

// Response for UpdateFinding.
message UpdateFindingResponse {
  // Updated finding record.
  grdr.common.v1alpha1.Finding finding = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for ListIncidents using AIP-158 cursor pagination and AIP-160 filters.
message ListIncidentsRequest {
  // Requested page size (default 50, maximum 1000).
  uint32 page_size = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AEAD-sealed opaque page cursor token.
  string page_token = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Bounded AIP-160 filter expression over filterable Incident fields.
  string filter = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Sort specification over sortable Incident fields.
  string order_by = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Response for ListIncidents.
message ListIncidentsResponse {
  // Current page of correlated security incidents.
  repeated grdr.common.v1alpha1.Incident incidents = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AIP-158 cursor pagination metadata.
  grdr.common.v1alpha1.PageInfo page_info = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for GetKillSwitch.
message GetKillSwitchRequest {}

// Response for GetKillSwitch.
message GetKillSwitchResponse {
  // Active emergency kill-switch or freeze state.
  grdr.common.v1alpha1.KillSwitchState kill_switch = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for SetKillSwitch.
message SetKillSwitchRequest {
  // Emergency action (freeze, kill, or release).
  grdr.common.v1alpha1.KillAction action = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Target containment scope.
  grdr.common.v1alpha1.KillScope scope = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Target session, device, or organisation identifier.
  string target_id = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Operator rationale required for audit trail.
  string reason = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_DERIVED];
  // Optional freeze duration in minutes (clamped safely on server).
  optional int64 duration_minutes = 5 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Response for SetKillSwitch.
message SetKillSwitchResponse {
  // Updated kill-switch state.
  grdr.common.v1alpha1.KillSwitchState kill_switch = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for ListAuditEvents using AIP-158 cursor pagination and AIP-160 filters.
message ListAuditEventsRequest {
  // Requested page size (default 50, maximum 1000).
  uint32 page_size = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AEAD-sealed opaque page cursor token.
  string page_token = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Bounded AIP-160 filter expression over filterable AuditEntry fields.
  string filter = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Sort specification over sortable AuditEntry fields.
  string order_by = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Response for ListAuditEvents.
message ListAuditEventsResponse {
  // Current page of audit log entries.
  repeated grdr.common.v1alpha1.AuditEntry entries = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AIP-158 cursor pagination metadata.
  grdr.common.v1alpha1.PageInfo page_info = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Approvals, findings triage, incident response, emergency kill switch, and audit log queries.
service ResponseService {
  // Lists step-up approval requests with keyset pagination. Never MCP-exposed.
  rpc ListApprovals(ListApprovalsRequest) returns (ListApprovalsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "response:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }

  // Approves or denies a pending step-up approval request.
  rpc DecideApproval(DecideApprovalRequest) returns (DecideApprovalResponse) {
    option (grdr.common.v1alpha1.scope) = "response:approve";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_CRITICAL_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_CRITICAL;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_CONSEQUENCE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }

  // Lists security findings with keyset pagination and AIP-160 filters.
  rpc ListFindings(ListFindingsRequest) returns (ListFindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "response:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = true;
  }

  // Updates triage lifecycle status on a security finding.
  rpc UpdateFinding(UpdateFindingRequest) returns (UpdateFindingResponse) {
    option (grdr.common.v1alpha1.scope) = "response:write";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_INTERACTIVE;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }

  // Lists correlated security incidents with keyset pagination and AIP-160 filters.
  rpc ListIncidents(ListIncidentsRequest) returns (ListIncidentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "response:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = true;
  }

  // Returns the current emergency kill-switch or freeze state.
  rpc GetKillSwitch(GetKillSwitchRequest) returns (GetKillSwitchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "response:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
  }

  // Activates, updates, or releases an emergency freeze or kill switch.
  rpc SetKillSwitch(SetKillSwitchRequest) returns (SetKillSwitchResponse) {
    option (grdr.common.v1alpha1.scope) = "response:kill";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_CRITICAL_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_CRITICAL;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_TYPED;
    option (grdr.common.v1alpha1.mcp_exposed) = false;
  }

  // Lists tamper-evident control-plane audit log entries with keyset pagination.
  rpc ListAuditEvents(ListAuditEventsRequest) returns (ListAuditEventsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "audit:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
  }
}
