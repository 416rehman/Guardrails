// Monitored agent sessions, turn traces, and schema-governed safe query inspection.
syntax = "proto3";

package grdr.api.activity.v1alpha1;

import "grdr/common/v1alpha1/options.proto";
import "grdr/common/v1alpha1/enums.proto";
import "grdr/common/v1alpha1/resources.proto";
import "grdr/common/v1alpha1/types.proto";

// Column descriptor returned by schema introspection.
message ColumnDef {
  // Column name.
  string name = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Data classification governing visibility.
  grdr.common.v1alpha1.SchemaDataClass data_class = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Human column description.
  string description = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // True when column is sensitive and omitted unless content grant is held.
  bool sensitive = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Queryable entity schema descriptor.
message EntitySchema {
  // Entity table name.
  string name = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Entity description.
  string description = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Columns defined on this entity.
  repeated ColumnDef columns = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Summary of visible columns for a queryable entity.
message EntitySummaryInfo {
  // Entity table name.
  string name = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Entity description.
  string description = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Columns currently visible to the caller's scope.
  repeated string visible_columns = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Correlation guidance descriptor respecting organisation privacy mode.
message UserIntentDescriptor {
  // Effective organisation identity mode.
  grdr.common.v1alpha1.IdentityMode identity_mode = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Guidance for joining activity without leaking protected identifiers.
  string correlation_guidance = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Safe join keys allowed across queries.
  repeated string safe_join_keys = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Fields stripped under the active privacy profile.
  repeated string schema_hidden_fields = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Typed scalar or list value inside a sampled query row.
message QueryCellValue {
  // Cell value representation matching JSON scalar/list types.
  oneof kind {
    // Text scalar value.
    string text = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_CONTENT, (grdr.common.v1alpha1.content_kind) = CONTENT_KIND_ARGUMENT, (grdr.common.v1alpha1.sealable) = true];
    // Unsigned integer scalar value.
    uint64 number = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
    // Boolean scalar value.
    bool boolean = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
    // Repeated string list value.
    StringList list = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  }
  reserved 900 to 999;
}

// Wrapper for string list cell values.
message StringList {
  // List elements.
  repeated string values = 1 [
    (grdr.common.v1alpha1.data_class) = DATA_CLASS_CONTENT,
    (grdr.common.v1alpha1.content_kind) = CONTENT_KIND_ARGUMENT,
    (grdr.common.v1alpha1.sealable) = true
  ];
  reserved 900 to 999;
}

// Single row in a sampled query response.
message QueryRow {
  // Column name to cell value map.
  map<string, QueryCellValue> columns = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_CONTENT, (grdr.common.v1alpha1.content_kind) = CONTENT_KIND_ARGUMENT, (grdr.common.v1alpha1.sealable) = true];
  reserved 900 to 999;
}

// Query execution plan summary returned alongside sampled rows.
message QueryPlanResult {
  // Queried entity name.
  string entity = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Approved visible columns actually projected.
  repeated string selected_columns = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Count of sensitive or hidden columns stripped from the request.
  uint64 hidden_columns_stripped = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Bounded row limit applied.
  uint32 effective_limit = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for ListSessions using AIP-158 cursor pagination and AIP-160 filters.
message ListSessionsRequest {
  // Requested page size (default 50, maximum 1000).
  uint32 page_size = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AEAD-sealed opaque page cursor token.
  string page_token = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Bounded AIP-160 filter expression over filterable SessionSummary fields.
  string filter = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Sort specification over sortable SessionSummary fields.
  string order_by = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Response for ListSessions.
message ListSessionsResponse {
  // Current page of session summaries.
  repeated grdr.common.v1alpha1.SessionSummary sessions = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // AIP-158 cursor pagination metadata.
  grdr.common.v1alpha1.PageInfo page_info = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for GetSession.
message GetSessionRequest {
  // Session identifier.
  string id = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Response for GetSession.
message GetSessionResponse {
  // Session summary metadata.
  grdr.common.v1alpha1.SessionSummary session = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Action attempts observed during the session.
  repeated grdr.common.v1alpha1.ActionAttempt attempts = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Signed decision receipts issued during the session.
  repeated grdr.common.v1alpha1.DecisionReceipt receipts = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Rolled-up conversational turns.
  repeated grdr.common.v1alpha1.TurnSummary turns = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Optional attributed user profile.
  optional grdr.common.v1alpha1.UserProfile user = 5 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 6 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for GetQuerySchema.
message GetQuerySchemaRequest {}

// Response for GetQuerySchema.
message GetQuerySchemaResponse {
  // Available query entity schemas filtered by privacy visibility.
  repeated EntitySchema entities = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for GetQueryEntities.
message GetQueryEntitiesRequest {}

// Response for GetQueryEntities.
message GetQueryEntitiesResponse {
  // Summaries of visible entities and columns.
  repeated EntitySummaryInfo entities = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for GetQueryUserIntent.
message GetQueryUserIntentRequest {}

// Response for GetQueryUserIntent.
message GetQueryUserIntentResponse {
  // Safe correlation guidance for user intent lookups.
  UserIntentDescriptor descriptor = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Request for SampleQuery.
message SampleQueryRequest {
  // Target entity name.
  string entity = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Requested columns; non-visible columns are stripped or rejected.
  repeated string columns = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Maximum row limit (capped by MAX_SAMPLE_LIMIT).
  optional uint32 limit = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Optional bounded filter text.
  optional string filter_text = 4 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_CONTENT, (grdr.common.v1alpha1.content_kind) = CONTENT_KIND_ARGUMENT, (grdr.common.v1alpha1.sealable) = true];
  reserved 900 to 999;
}

// Response for SampleQuery.
message SampleQueryResponse {
  // Sanitized query execution plan.
  QueryPlanResult plan = 1 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Sampled metadata rows.
  repeated QueryRow rows = 2 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  // Untrusted agent data warning banner.
  string untrusted_warning = 3 [(grdr.common.v1alpha1.data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Monitored sessions, execution timelines, and privacy-safe query inspection.
service SessionService {
  // Lists monitored sessions with keyset pagination and AIP-160 filters.
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "activity:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_SENSITIVE_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = true;
  }

  // Returns full detail, turns, attempts, and signed receipts for a session.
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "activity:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_SENSITIVE_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_INTERACTIVE;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = true;
  }

  // Returns privacy-filtered query schema descriptors.
  rpc GetQuerySchema(GetQuerySchemaRequest) returns (GetQuerySchemaResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "activity:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
  }

  // Lists queryable entity summaries and visible columns.
  rpc GetQueryEntities(GetQueryEntitiesRequest) returns (GetQueryEntitiesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "activity:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
  }

  // Returns user-intent correlation guidance respecting privacy mode.
  rpc GetQueryUserIntent(GetQueryUserIntentRequest) returns (GetQueryUserIntentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "activity:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
  }

  // Executes a bounded, read-only metadata query sample.
  rpc SampleQuery(SampleQueryRequest) returns (SampleQueryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "activity:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_SENSITIVE_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_INTERACTIVE;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
  }
}
