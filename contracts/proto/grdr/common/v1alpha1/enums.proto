// Canonical domain enumerations shared across Guardrails ADR protobuf contracts.
syntax = "proto3";

package grdr.common.v1alpha1;

import "grdr/common/v1alpha1/options.proto";

// Enforcement mode applied to a rule or pack (Off, Watch, Ask, Block).
enum Mode {
  // Unspecified enforcement mode.
  MODE_UNSPECIFIED = 0;
  // Rule is disabled.
  MODE_OFF = 1 [(wire_name) = "off"];
  // Rule records telemetry hits without prompting or blocking.
  MODE_WATCH = 2 [(wire_name) = "watch"];
  // Rule triggers interactive step-up approval.
  MODE_ASK = 3 [(wire_name) = "ask"];
  // Rule immediately denies matching attempts.
  MODE_BLOCK = 4 [(wire_name) = "block"];
}

// Enforcement verdict returned by policy evaluation.
enum Verdict {
  // Unspecified verdict.
  VERDICT_UNSPECIFIED = 0;
  // Action is permitted to proceed.
  VERDICT_ALLOW = 1 [(wire_name) = "allow"];
  // Action is rewritten or constrained before execution.
  VERDICT_MODIFY = 2 [(wire_name) = "modify"];
  // Action requires out-of-band approval step-up.
  VERDICT_STEP_UP = 3 [(wire_name) = "step_up"];
  // Decision is deferred for asynchronous review.
  VERDICT_DEFER = 4 [(wire_name) = "defer"];
  // Action is denied.
  VERDICT_DENY = 5 [(wire_name) = "deny"];
}

