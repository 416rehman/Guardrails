  // File read operation.
  ACTION_CLASS_FILE_READ = 2 [(wire_name) = "file.read"];
  // File creation or modification.
  ACTION_CLASS_FILE_WRITE = 3 [(wire_name) = "file.write"];
  // File deletion.
  ACTION_CLASS_FILE_DELETE = 4 [(wire_name) = "file.delete"];
  // Network socket connection.
  ACTION_CLASS_NET_CONNECT = 5 [(wire_name) = "net.connect"];
  // Outbound HTTP or network request.
  ACTION_CLASS_NET_REQUEST = 6 [(wire_name) = "net.request"];
  // Model inference request.
  ACTION_CLASS_LLM_REQUEST = 7 [(wire_name) = "llm.request"];
  // MCP server transport connection.
  ACTION_CLASS_MCP_CONNECT = 8 [(wire_name) = "mcp.connect"];
  // MCP tool invocation.
  ACTION_CLASS_MCP_CALL = 9 [(wire_name) = "mcp.call"];
  // Credential or secret access.
  ACTION_CLASS_CRED_USE = 10 [(wire_name) = "cred.use"];
  // Subagent process spawn.
  ACTION_CLASS_AGENT_SPAWN = 11 [(wire_name) = "agent.spawn"];
  // Agent or environment configuration mutation.
  ACTION_CLASS_CONFIG_CHANGE = 12 [(wire_name) = "config.change"];
  // Privilege elevation request.
  ACTION_CLASS_ELEVATE = 13 [(wire_name) = "elevate"];
  // Interactive UI automation action.
  ACTION_CLASS_UI_ACT = 14 [(wire_name) = "ui.act"];
  // Cross-boundary data flow transfer.
  ACTION_CLASS_DATA_FLOW = 15 [(wire_name) = "data.flow"];
}

