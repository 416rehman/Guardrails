// Shared pagination, revision, and coded error types for Guardrails ADR APIs.
syntax = "proto3";

package grdr.common.v1alpha1;

import "grdr/common/v1alpha1/options.proto";

// Broad failure category carried in ErrorDetail.
enum ErrorClass {
  // Unspecified error class.
  ERROR_CLASS_UNSPECIFIED = 0;
  // Invalid request arguments, filter syntax, or page token.
  ERROR_CLASS_VALIDATION = 1 [(wire_name) = "validation"];
  // Missing or invalid caller authentication credentials.
  ERROR_CLASS_AUTH = 2 [(wire_name) = "auth"];
  // Authenticated caller lacks required policy scope.
  ERROR_CLASS_PERMISSION = 3 [(wire_name) = "permission"];
  // Requested resource was not found.
  ERROR_CLASS_NOT_FOUND = 4 [(wire_name) = "not_found"];
  // Revision ETag or uniqueness conflict.
  ERROR_CLASS_CONFLICT = 5 [(wire_name) = "conflict"];
  // Caller exceeded configured rate budget.
  ERROR_CLASS_RATE_LIMIT = 6 [(wire_name) = "rate_limit"];
  // Unexpected internal server error.
  ERROR_CLASS_INTERNAL = 7 [(wire_name) = "internal"];
}

// Structured error identity matching google.rpc.ErrorInfo wire layout.
message ErrorInfo {
  // Registry UPPER_SNAKE error reason, for example PAGE_TOKEN_INVALID.
  string reason = 1 [(data_class) = DATA_CLASS_STRUCTURAL];
  // Error domain identifier, fixed to grdr.api for server responses.
  string domain = 2 [(data_class) = DATA_CLASS_STRUCTURAL];
  // Structured contextual attributes such as code, field, or request_id.
  map<string, string> metadata = 3 [(data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// Guardrails-specific coded error detail attached to Connect error responses.
message ErrorDetail {
  // Stable Guardrails registry code in GRDR-<AREA>-<NNNN> format.
  string code = 1 [(data_class) = DATA_CLASS_STRUCTURAL];
  // UPPER_SNAKE machine-readable reason for programmatic branching.
  string reason = 2 [(data_class) = DATA_CLASS_STRUCTURAL];
  // Coarse error category.
  ErrorClass class = 3 [(data_class) = DATA_CLASS_STRUCTURAL];
  // English diagnostic message safe for operators and logs.
  string message = 4 [(data_class) = DATA_CLASS_DERIVED];
  // Optional i18n message token id.
  string message_id = 5 [(data_class) = DATA_CLASS_STRUCTURAL];
  // Concise remediation hint.
  string fix = 6 [(data_class) = DATA_CLASS_DERIVED];
  // Documentation reference URL or anchor.
  string docs_url = 7 [(data_class) = DATA_CLASS_STRUCTURAL];
  // Correlation request id matching the grdr-request-id HTTP header.
  string request_id = 8 [(data_class) = DATA_CLASS_STRUCTURAL];
  // Additional structured error context.
  map<string, string> metadata = 9 [(data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}

// AIP-158 cursor pagination metadata returned by all list endpoints.
message PageInfo {
  // AEAD-sealed opaque cursor token for fetching the next page.
  string next_page_token = 1 [(data_class) = DATA_CLASS_STRUCTURAL];
  // AEAD-sealed opaque cursor token for returning to the previous page.
  string prev_page_token = 2 [(data_class) = DATA_CLASS_STRUCTURAL];
  // Estimated total matching rows from server metadata without full table count.
  uint64 total_size_estimate = 3 [(data_class) = DATA_CLASS_DERIVED];
  // True when more matching items remain after the current page.
  bool has_more = 4 [(data_class) = DATA_CLASS_DERIVED];
  reserved 900 to 999;
}

// Revision and caching metadata for conditional GET and optimistic updates.
message RevisionMeta {
  // Strong or weak ETag value computed from collection revision, filter, and order.
  string etag = 1 [(data_class) = DATA_CLASS_STRUCTURAL];
  // Monotonic collection high-water mark sequence number.
  uint64 high_water_mark = 2 [(data_class) = DATA_CLASS_STRUCTURAL];
  reserved 900 to 999;
}
