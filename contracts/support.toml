# Guardrails ADR Support and Compatibility Matrix (ADR-0019, D-50, D-58, D-71, docs/design/24, 33)
schema = "grdr.support.v1alpha1"
manifest_schema = "deploy/release/release-manifest.schema.json"

[release_policy]
cadence = "monthly"
supported_minors_behind = 2
lts_security_months = 24
first_lts_min_days_after_ga = 90
lts_interval_minors = 12
max_upgrade_minor_hop = 2
rollback_window_minors = 1

[os.linux]
tier = 1
architectures = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
distributions = ["debian-12", "debian-13", "ubuntu-24.04", "ubuntu-26.04", "rhel-9", "rocky-9", "fedora-current"]
min_kernel = "5.15"
recommended_kernel = "6.1"
container_runtime = ["containerd", "cri-o", "docker"]

[os.windows]
tier = 1
architectures = ["x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
versions = ["windows-11-24h2", "windows-11-25h2", "windows-11-26h2"]
server_tier2 = ["windows-server-2022", "windows-server-2025"]
wsl_min_major = 3
unsupported_skus = ["windows-multisession-avd"]
optional_driver_status = "precondition-gated"

[os.macos]
tier = 1
architectures = ["aarch64-apple-darwin", "x86_64-apple-darwin"]
versions = ["macos-15-sequoia", "macos-16-tahoe"]
notarisation_status = "precondition-gated"
endpoint_security_status = "precondition-gated"

[platform.kubernetes]
tier = 1
supported_versions = ["1.35", "1.36", "1.37"]
eol_versions = ["1.34"]
helm_min_v3 = "3.19.0"
helm_min_v4 = "4.3.0"
server_pod_security_standard = "restricted"

[platform.databases]
postgresql_major = 18
postgresql_tier = 1
sqlite_embedded_via = "rusqlite-0.41.1"
cnpg_reference_version = "1.30.1"

[platform.bus]
embedded = "sqlite-log"
ha = "postgresql-log"
distributed = "nats-jetstream-2.15.2"

[platform.object_stores]
tier1 = ["aws-s3", "gcs", "azure-blob", "seaweedfs-4.53", "ceph-rgw"]
tier2 = ["s3-compatible-conformant"]
excluded = ["minio-archived"]

[agents]
tier1 = ["claude-code", "codex", "cursor", "copilot-cli"]
supported_minor_window = 2

[device_keys]
windows_tpm = "supported"
macos_secure_enclave = "precondition-gated"
linux_tpm = "supported"
container_ephemeral = "supported"
ci_oidc = "supported"

[compatibility_matrix]
wire_major = 1
schema_rev = 1
sensor_skew_behind = 2
sensor_skew_ahead = 1

[[compatibility_matrix.contracts]]
name = "grdr.ingest"
version = "v1alpha1"
min_wire_major = 1
max_wire_major = 1

[[compatibility_matrix.contracts]]
name = "grdr.fleet"
version = "v1alpha1"
min_wire_major = 1
max_wire_major = 1

[[compatibility_matrix.contracts]]
name = "grdr.bootstrap"
version = "v1"
frozen = true
min_wire_major = 1
max_wire_major = 1

[[compatibility_matrix.contracts]]
name = "grdr.operator"
version = "v1alpha1"
min_wire_major = 1
max_wire_major = 1

[[compatibility_matrix.contracts]]
name = "grdr.pack"
version = "v1alpha1"
min_wire_major = 1
max_wire_major = 1
