# Guardrails ADR Operational Limits, Budgets, and Retry Policies (ADR-0022, P15, docs/design/03, 11, 20, 21, 22, 32)
schema = "grdr.limits.v1alpha1"

[endpoint.memory_mb]
daemon = 40
engine = 140
uplink = 20
proxy = 30
tray = 8
console = 12
updater = 32
approve = 32
total_resident_target = 250

[endpoint.cpu_pct]
idle_max = 1.0

[endpoint.disk_mb]
total_cap = 1024
spool_cap = 512
decision_reserve = 64
cache_cap = 256

[endpoint.latency_ms]
hook_linux_p50 = 10
hook_linux_p99 = 50
hook_macos_p50 = 10
hook_macos_p99 = 50
hook_windows_p50 = 25
hook_windows_p99 = 100
shim_hang_max = 2000
policy_1000_p99 = 1
fastpath_cached_us = 100
fastpath_uncached_us = 1000
proxy_added_p99 = 20
proxy_first_byte_p99 = 5

[endpoint.ipc]
max_frame_bytes = 1048576
connect_timeout_ms = 500
read_timeout_ms = 1500
command_hold_max_ms = 1000

[endpoint.prompts]
median_per_dev_day = 3
p95_per_dev_day = 8
max_opaque_pct = 2.0

[packs]
essentials_max_kb = 512
detections_max_mb = 4
intel_base_max_mb = 24
intel_daily_segment_max_kb = 100
max_pack_bundle_mb = 32

[uplink.schedule]
spine_interval_s = 10
spine_max_interval_s = 30
heartbeat_interval_s = 300
reconnect_spread_ms = 60000
backfill_target_hours_low = 6
backfill_target_hours_high = 24
max_batch_bytes = 262144
max_batch_events = 1000
tuf_timestamp_stale_s = 300
stale_after_days = 14
kill_delivery_target_s = 10
kill_delivery_max_s = 60
policy_rollout_p99_s = 60
destructive_cmds_per_10m_max = 3
offline_renewal_days = 180
fleet_response_key_hours = 24

[retry.uplink_reconnect]
max_attempts = 16
initial_backoff_ms = 500
max_backoff_ms = 60000
multiplier = 2.0
jitter = 0.25

[retry.ingest_flush]
max_attempts = 8
initial_backoff_ms = 100
max_backoff_ms = 10000
multiplier = 2.0
jitter = 0.2

[retry.kms_unwrap]
max_attempts = 4
initial_backoff_ms = 50
max_backoff_ms = 1500
multiplier = 2.0
jitter = 0.15

[retry.webhook_deliver]
max_attempts = 6
initial_backoff_ms = 1000
max_backoff_ms = 300000
multiplier = 3.0
jitter = 0.2

[server.ingest]
max_body_bytes = 10485760
max_skew_seconds = 300
ack_p99_ms = 200
detection_lag_p99_ms = 5000
freshness_p99_s = 60
ha_endpoint_ceiling_5k = 50000
ha_endpoint_ceiling_100k = 10000
distributed_tls_conn_per_sec_per_cell = 2000

[server.lake]
small_org_day_max_objects = 9
small_org_day_max_puts = 200
catalogue_commit_p99_ms = 100
catalogue_max_rows_per_file = 20
late_file_write_amp_max = 2.5
timeline_p95_s = 2
agg_30d_low_s = 10
agg_30d_high_s = 60
hunt_bg_threshold_gb = 50
wal_bytes_per_event_max = 1536
archive_lag_p99_s = 120

[server.relational]
transaction_life_ms = 5000
set_transaction_life_ms = 1000

[server.tenancy]
confirm_interval_s = 300
copy_life_days = 35
pitr_window_days = 35
erasure_cancel_window_days = 30
payment_retry_days = 14
suspended_grace_days = 60
free_inactive_days = 90
structural_default_retention_days = 184

[server.preflight]
backup_max_age_hours = 24
wal_lag_max_minutes = 5
sqlite_backup_max_age_minutes = 10
restore_drill_warn_days = 35
restore_drill_fail_days = 90
cert_min_validity_days = 14
clock_skew_pg_fail_s = 1
clock_skew_http_warn_s = 2
clock_skew_http_fail_s = 60
disk_headroom_min_pct = 30
synthetic_alarm_max_age_days = 7

[server.enrolment]
default_rate_per_hour = 6000
vdi_pool_rate_per_hour = 60000
max_devices_default = 10000
token_ttl_hours = 24

[server.operator]
settings_apply_timeout_s = 30
rto_relational_minutes = 5
rto_events_hours = 4
rollback_circuit_breaker_pct = 15

[endpoint.linux_sensor]
catalogue_file_max_bytes = 1048576
seccheck_line_max_bytes = 32768
cri_field_max_bytes = 512
cri_annotations_max = 128
trampoline_cap = 36
trampoline_slots_enforce = 10

[endpoint.sandbox]
floor_pubkey_max_bytes = 512
seccomp_denied_rules_max = 64
default_memory_limit_bytes = 2147483648
default_cgroup_pids_max = 256
