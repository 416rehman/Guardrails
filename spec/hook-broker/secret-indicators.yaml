schema: grdr.spec.secret-indicators/v1alpha1
# P14 structured secret prefixes and key=value secret markers redacted alongside
# packs/credential-locator/lists/locators.yaml and core content rules.
substrings_lower:
  - "bearer "
  - "basic "
  - "password="
  - "token="
  - "secret="
  - "api_key="
structured_prefixes_lower:
  - prefix: "ghp_"
    min_tail: 12
  - prefix: "ghs_"
    min_tail: 12
  - prefix: "github_pat_"
    min_tail: 12
  - prefix: "xoxb-"
    min_tail: 10
  - prefix: "xoxp-"
    min_tail: 10
  - prefix: "aiza"
    min_tail: 20
  - prefix: "asia"
    min_tail: 16
  - prefix: "akia"
    min_tail: 16
  - prefix: "sk-"
    min_tail: 12
  - prefix: "sk-ant-"
    min_tail: 8
