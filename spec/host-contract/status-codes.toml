# grdr_status codes of both C interfaces (spec/host-contract/c-abi.md section 6). A value is never
# reused: a retired code keeps its row with retired = true, and a new code takes the next free
# value. handle_after is one of usable, usable-state-unchanged, no-handle, last-known-good,
# previous-profile, poisoned, recreate-from-snapshot, reload-required. last-known-good means the
# host keeps the handle or tables it was using before the call; tables that returned GRDR_E_CHANGED
# are never last-known-good. reload-required means the host retires the handle at once and never
# calls it again (its cache generation stops being current, no verdict cached under it is read, and
# the result of any call that was running on it is discarded), keeps the interest filters, frees the
# old blob and arena only after the quiescence point, answers as tables.md section 11 says when the
# floor cannot answer and reports Degraded until a load from a freshly verified copy succeeds,
# starts the first reload at once and bounds the rest with a retry policy, reports every
# GRDR_E_CHANGED from a handle in use as tamper, and ends reloading when a reloaded handle returns
# it before it has served a settle period. grdr_status_str returns a row's name, or unknown_name
# for a value with no row.

unknown_name = "GRDR_E_UNKNOWN"

[[status]]
name = "GRDR_OK"
value = 0
meaning = "Success."
handle_after = "usable"

[[status]]
name = "GRDR_E_ARG"
value = 1
meaning = "An argument is invalid: a null pointer, a struct_size below the struct's base size, or a value outside its documented range. For the fast path, also an input field out of range."
handle_after = "usable"

[[status]]
name = "GRDR_E_ABI"
value = 2
meaning = "ABI mismatch: grdr_abi_check failed, or a table blob's abi_min exceeds the fast-path library."
handle_after = "no-handle"

[[status]]
name = "GRDR_E_DECODE"
value = 3
meaning = "A malformed input message or state bytes."
handle_after = "usable-state-unchanged"

[[status]]
name = "GRDR_E_BUNDLE"
value = 4
meaning = "Bundle rejected. For the fast path, a table blob that fails a TV rule, or an evaluation whose cost exceeds the blob's eval_cap. The host keeps the tables it was using before the call, unless those tables returned GRDR_E_CHANGED: such tables are never used again, so a host that held only those, or none, has no tables until a load succeeds."
handle_after = "last-known-good"

[[status]]
name = "GRDR_E_PROFILE"
value = 5
meaning = "Host profile invalid."
handle_after = "previous-profile"

[[status]]
name = "GRDR_E_RESOURCE"
value = 6
meaning = "Memory cap reached, or a host allocator callback returned null."
handle_after = "usable-state-unchanged"

[[status]]
name = "GRDR_E_BUDGET"
value = 7
meaning = "Step budget exhausted."
handle_after = "usable-state-unchanged"

[[status]]
name = "GRDR_E_STATE"
value = 8
meaning = "Call out of order, or state bytes from another bundle. For the fast path, label bits from another bundle: labels_bundle_tag differs from the loaded tables."
handle_after = "usable"

[[status]]
name = "GRDR_E_POISONED"
value = 9
meaning = "The handle was poisoned earlier."
handle_after = "recreate-from-snapshot"

[[status]]
name = "GRDR_E_INTERNAL"
value = 10
meaning = "An internal consistency check failed: a bug caught without panicking."
handle_after = "poisoned"

[[status]]
name = "GRDR_E_CHANGED"
value = 11
meaning = "Fast path only: the tables' blob, arena or handle no longer reads as grdr_fp_load validated it, now or on an earlier call on the same handle."
handle_after = "reload-required"
