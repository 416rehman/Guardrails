# Risk-based evaluator selection (ADR-0043). Higher matching tier wins; never lowered.
# Three lanes:
#   fast_track (0 evaluators) : green CI decides for dependency/tool pins, docs, tests, small fixes.
#   medium     (1 evaluator)  : eval-review on standard tier for normal code/hooks/kits.
#   high / trust_core (2)     : eval-review + eval-security on 2 distinct models/providers, max 2 rounds.
# Every `paths` glob is a git :(glob,icase) pathspec from the root, with zero brace `{...}` globs,
# so ASCII case does not matter; `**/` matches zero or more folders, and a folder line `x/**` also
# matches `x` itself.

[limits]
max_rounds = 2

[trust_core]
paths_file = "security/trust-core.paths"
distinct_models = 2
evaluators = ["eval-review", "eval-security"]

[high]
paths = [
  "contracts/proto/**", "contracts/cedar/**", "contracts/limits.toml", "contracts/support.toml", "docs/spec/**",
  "crates/grdr-proto/**", "crates/grdr-schema/**", "crates/grdr-model/**",
  "crates/grdr-ports/**", "crates/grdr-wire/**",
  "specs/**"
]
triggers = [
  "public_api_change", "wire_or_pack_format_change",
  "unsafe_added", "fail_mode_change", "security_test_weakened",
  "new_unapproved_licence"
]
distinct_models = 2
evaluators = ["eval-review", "eval-security"]

[medium]
paths = [
  "crates/**", "programs/**", "platform/**", "web/**", "desktop/**", "deploy/**", "contracts/interface/**",
  "**/.claude/**", "**/.agents/**", ".github/actions/**", "**/AGENTS.md", "**/CLAUDE.md", "**/GEMINI.md", "**/CODEX.md"
]
triggers = []
evaluators = ["eval-review"]
model_tier = "standard"

[fast_track]
# Routine changes verified by deterministic CI (cargo-deny, osv-scanner, Pin reader, tools,
# fmt/clippy/tests, docs-check, branch-check, gitleaks, Semgrep, zizmor). Merge once green when
# no trust-core or high path/trigger matches.
paths = [
  "docs/**", "**/*.md",
  "Cargo.toml", "Cargo.lock", "rust-toolchain.toml",
  "security/supply-chain/build-tools.toml", "security/supply-chain/fixtures/**",
  "rustfmt.toml", "**/clippy.toml",
  "deploy/release/release-please-config.json", "deploy/release/.release-please-manifest.json",
  "package.json", "pnpm-lock.yaml"
]
triggers = [
  "dependency_or_tool_pin", "docs_or_config_only",
  "tests_only_addition", "small_bug_fix_under_50_lines"
]
evaluators = []
skip_spec_writer = true
direct_orchestrator_allowed = true

# Concise one-line reminders passed inline to eval-review / eval-security instead of extra agents.
[checklist_addons]
ui = "Check keyboard navigation, focus/contrast tokens, and responsive layout via UI specs (no hardcoded colours)."
interface_paths = ["web/**", "site/**", "contracts/interface/**", "desktop/**", "programs/grdr/**", "programs/grdr-tray/**", "programs/grdr-approve/**", "platform/*/installer/**"]
api = "Check wire/public Rust API backward compatibility, protobuf data_class annotations, and versioning."
dependency = "Verify new dependencies against security/supply-chain/licences.toml and Cargo.lock provenance."
installer = "Verify platform signing, uninstall cleanup, and OS path conventions."
content = "Check pack/rule schema validity, false-positive edge cases, and licence allow-list."
adapter = "Verify OS/engine adapter trait compliance and parity across supported platforms."
rfc = "Reviewed by eval-review + eval-security only (no persona council fan-out; max 2 rounds)."
runtime_trust_core = "Confirm reference model, differential tests, and D-62/D-63 boundary checks."
