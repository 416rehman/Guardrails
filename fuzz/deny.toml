# Fuzz-scoped cargo-deny policy allowing NCSA solely for libfuzzer-sys in the excluded fuzz crate.
# Workspace production and test targets remain strictly gated by security/deny.toml without NCSA.

[graph]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"
unsound = "all"
unused-ignored-advisory = "deny"
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "transitive chrono via cedar-policy-core datetime feature; no upstream replacement yet" },
]

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "MPL-2.0",
  "NCSA",
]
confidence-threshold = 0.93
unused-allowed-license = "allow"
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [
  { crate = "ferrisetw", reason = "unmaintained since 2025-08" },
  { crate = "windivert", reason = "not a release dependency" },
  { crate = "madsim", reason = "unmaintained or unstable" },
  { crate = "fluvio", reason = "unmaintained or unstable" },
  { crate = "iggy", reason = "unmaintained or unstable" },
  { crate = "tensorzero", reason = "archived upstream" },
  { crate = "rsigma", reason = "security history: all five 2026 advisories" },
  { crate = "rsigma-runtime", reason = "security history: all five 2026 advisories" },
  { crate = "rsigma-mcp", reason = "security history: all five 2026 advisories" },
  { crate = "cel", reason = "Cedar is the only enforced expression language" },
  { crate = "cel-interpreter", reason = "Cedar is the only enforced expression language" },
  { crate = "duckdb", reason = "lake engine is DataFusion" },
  { crate = "chdb-rust", reason = "no Windows build" },
  { crate = "pingora", reason = "Windows support is preliminary" },
  { crate = "surrealdb", reason = "BSL, not open source" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
