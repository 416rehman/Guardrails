format: grdr.compliance-regulatory.v1
pack_id: grdr.compliance
version: "1.0.0"
oscal_version: "1.2.3"
crypto_allowlist:
  approved_crates:
    - "aead"
    - "aws-lc-rs"
    - "aws-lc-sys"
    - "chacha20"
    - "chacha20poly1305"
    - "cipher"
    - "crypto-common"
    - "curve25519-dalek"
    - "curve25519-dalek-derive"
    - "digest"
    - "ed25519"
    - "ed25519-dalek"
    - "fiat-crypto"
    - "getrandom"
    - "hmac"
    - "hyper-rustls"
    - "poly1305"
    - "rustls"
    - "rustls-native-certs"
    - "rustls-pki-types"
    - "rustls-platform-verifier"
    - "rustls-platform-verifier-android"
    - "rustls-webpki"
    - "sha2"
    - "sha3"
    - "signature"
    - "subtle"
    - "tokio-rustls"
    - "universal-hash"
    - "zeroize"
  restricted_primitives:
    - "md5"
    - "md-5"
    - "sha-1"
    - "sha1"
    - "sha1_smol"
    - "des"
    - "rc4"
    - "rsa"
    - "openssl"
    - "openssl-sys"
    - "blowfish"
    - "ring"
    - "aes-gcm"
    - "x25519-dalek"
  export_doc_markers:
    - "Ed25519 (RFC 8032)"
    - "ChaCha20-Poly1305 (RFC 8439)"
    - "SHA-256 & HMAC-SHA256"
    - "TLS 1.3"
cra_annex_i:
  - id: "CRA-I-1(1)"
    part: "Part I"
    obligation: "Appropriate level of cybersecurity based on risks; shipped secure by default"
    capabilities: ["cap.preexec.enforce", "cap.containment"]
    artifact: "packs/essentials/rules/essentials.cedar"
  - id: "CRA-I-1(2)(a)"
    part: "Part I"
    obligation: "Delivered without known exploitable vulnerabilities"
    capabilities: ["cap.supplychain.provenance"]
    artifact: ".github/workflows/scan.yml"
  - id: "CRA-I-1(2)(c)"
    part: "Part I"
    obligation: "Protect confidentiality and integrity via vetted standard cryptography"
    capabilities: ["cap.receipts.signed", "cap.privacy.floor"]
    artifact: "crates/grdr-crypto/src/lib.rs"
  - id: "CRA-I-1(2)(d)"
    part: "Part I"
    obligation: "Process only minimum necessary data (privacy floor, metadata default)"
    capabilities: ["cap.privacy.floor", "cap.retention.policy"]
    artifact: "docs/design/29-compliance-and-privacy.md"
  - id: "CRA-I-1(2)(k)"
    part: "Part I"
    obligation: "Record and monitor security-relevant activity with tamper protection"
    capabilities: ["cap.receipts.signed", "cap.export.siem"]
    artifact: "docs/compliance/cra-technical-file.md"
  - id: "CRA-II-1"
    part: "Part II"
    obligation: "Maintain CycloneDX/SPDX SBOM identifying components and dependencies"
    capabilities: ["cap.supplychain.provenance"]
    artifact: "docs/compliance/cra-technical-file.md"
  - id: "CRA-II-2"
    part: "Part II"
    obligation: "Coordinate vulnerability handling and publish OpenVEX/CSAF advisories without delay"
    capabilities: ["cap.detect.respond", "cap.policy.change"]
    artifact: "crates/grdr-comply/data/incident-regimes.yaml"
soc2_controls:
  - control_id: "CC4.1"
    owner: "Compliance & Oversight Lead"
    category: "Monitoring Activities"
    evidence_source: "Quarterly OversightQualityReport + rule review audits"
    capability: "cap.oversight.report"
  - control_id: "CC6.1"
    owner: "Platform Identity & RBAC Lead"
    category: "Logical Access"
    evidence_source: "Agent inventory, RBAC policy, separation of duties"
    capability: "cap.inventory.agents"
  - control_id: "CC6.2"
    owner: "Security Operations Lead"
    category: "Access Approval"
    evidence_source: "Graded STEP_UP approval grants and deny-when-unreachable proofs"
    capability: "cap.approval.graded"
  - control_id: "CC6.3"
    owner: "Identity Broker Lead"
    category: "Least Privilege"
    evidence_source: "Scoped lease records and Just-In-Time SupportGrant expiries"
    capability: "cap.identity.brokered"
  - control_id: "CC6.5"
    owner: "Data Privacy Officer"
    category: "Data Disposal"
    evidence_source: "Subject erasure cascades, DEK destruction, 35d backup cap"
    capability: "cap.retention.policy"
  - control_id: "CC6.6"
    owner: "Containment Engineering Lead"
    category: "Boundary Protection"
    evidence_source: "OS sandbox execution containment and domain allow-list verdicts"
    capability: "cap.containment"
  - control_id: "CC6.8"
    owner: "Policy Engine Lead"
    category: "Malicious Software Prevention"
    evidence_source: "Deterministic pre-execution Cedar verdict enforcement"
    capability: "cap.preexec.enforce"
  - control_id: "CC7.2"
    owner: "Audit Chain Lead"
    category: "System Monitoring"
    evidence_source: "Ed25519 signed decision receipts and OCSF export stream"
    capability: "cap.receipts.signed"
  - control_id: "CC7.3"
    owner: "Detection Engineering Lead"
    category: "Anomaly Evaluation"
    evidence_source: "Sigma detection rule fixtures and synthetic sensor baselines"
    capability: "cap.detect.respond"
  - control_id: "CC7.4"
    owner: "Incident Commander (PSIRT)"
    category: "Incident Response"
    evidence_source: "Scoped kill-switch drill logs and 24h/72h/14d timeline export"
    capability: "cap.detect.respond"
  - control_id: "CC8.1"
    owner: "Release Engineering Lead"
    category: "Change Management"
    evidence_source: "Signed policy revisions, risk tiers, dual-model review gates, CI runs"
    capability: "cap.policy.change"
  - control_id: "CC9.2"
    owner: "Supply-Chain Lead"
    category: "Vendor & Component Risk"
    evidence_source: "MCP/skill digest pinning, cargo-deny, and manifest drift checks"
    capability: "cap.supplychain.provenance"
  - control_id: "A1.2"
    owner: "Storage & Availability Lead"
    category: "Recovery Objectives"
    evidence_source: "Server RunBackupDrill restore and PITR verification records"
    capability: "cap.retention.policy"
  - control_id: "A1.3"
    owner: "Storage & Availability Lead"
    category: "Recovery Testing"
    evidence_source: "Automated lake flush, compaction, and erasure-on-restore replay tests"
    capability: "cap.retention.policy"
  - control_id: "P4.1"
    owner: "Data Privacy Officer"
    category: "Privacy Retention"
    evidence_source: "Floor vs ceiling conflict validator, HoldsLedger, Art. 30 RoPA"
    capability: "cap.privacy.floor"
wcag_22_aa:
  - criterion: "1.1.1"
    level: "A"
    title: "Non-text Content"
    surface: "web-and-desktop"
    check_method: "axe-core automated scan + semantic alt/aria labels on charts and badges"
  - criterion: "1.3.1"
    level: "A"
    title: "Info and Relationships"
    surface: "web-and-desktop"
    check_method: "Semantic landmarks, table headers, and AccessKit tree roles"
  - criterion: "1.4.3"
    level: "AA"
    title: "Contrast (Minimum)"
    surface: "web-and-desktop"
    check_method: "Porcelain Light and Carbon Obsidian design token contrast >= 4.5:1"
  - criterion: "1.4.10"
    level: "AA"
    title: "Reflow"
    surface: "web"
    check_method: "Zero horizontal overflow across 390px, 768px, and 1280px viewports"
  - criterion: "1.4.11"
    level: "AA"
    title: "Non-text Contrast"
    surface: "web-and-desktop"
    check_method: "Focus indicators and interactive borders >= 3:1 contrast"
  - criterion: "2.1.1"
    level: "A"
    title: "Keyboard"
    surface: "web-and-desktop"
    check_method: "Full keyboard tab traversal, Escape dialog close, zero focus traps"
  - criterion: "2.4.7"
    level: "AA"
    title: "Focus Visible"
    surface: "web-and-desktop"
    check_method: "Explicit focus-visible outline tokens on all interactive controls"
  - criterion: "2.5.8"
    level: "AA"
    title: "Target Size (Minimum)"
    surface: "web"
    check_method: "Touch and button controls >= 24x24 CSS px with adequate spacing"
  - criterion: "3.3.1"
    level: "A"
    title: "Error Identification"
    surface: "web-and-desktop"
    check_method: "Plain-language inline error summaries bound via aria-describedby"
  - criterion: "4.1.2"
    level: "A"
    title: "Name, Role, Value"
    surface: "web-and-desktop"
    check_method: "ARIA roles/states in Console DOM and AccessKit bridge in Rune Desktop"
  - criterion: "4.1.3"
    level: "AA"
    title: "Status Messages"
    surface: "web-and-desktop"
    check_method: "Live region announcements for approval, hold, and kill-switch feedback"
