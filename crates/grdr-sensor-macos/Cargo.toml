[package]
name = "grdr-sensor-macos"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.grdr]
layer = 3
privilege = "privileged"
surface = "internal"
renders = "none"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
grdr-fastpath = { workspace = true }
grdr-model = { workspace = true }
grdr-ports = { workspace = true }
grdr-schema = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
grdr-ports-testkit = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
arithmetic_side_effects = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
exit = "deny"
