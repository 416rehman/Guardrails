[package]
name = "grdr-ipc-os"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.grdr]
layer = 3
privilege = "privileged"
surface = "internal"
renders = "none"

[dependencies]
grdr-model = { workspace = true }
grdr-wire = { version = "0.1.0", path = "../grdr-wire", default-features = false }
jiff = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
grdr-crypto = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
exit = "deny"
