[package]
name = "grdr-wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.grdr]
layer = 1
privilege = "none"
surface = "public"
renders = "none"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
grdr-fastpath = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
grdr-core = { workspace = true }
grdr-model = { workspace = true }

# A copy of the root [workspace.lints] with unsafe_code = "deny" in place of "forbid", so a
# reasoned #[allow(unsafe_code)] can admit one item. Keep it in step with the root table.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
exit = "deny"
