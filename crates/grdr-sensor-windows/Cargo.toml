[package]
name = "grdr-sensor-windows"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.grdr]
layer = 3
privilege = "privileged"
surface = "internal"
renders = "none"

[dependencies]
grdr-fastpath = { workspace = true }
grdr-model = { workspace = true }
grdr-os-service = { workspace = true }
grdr-ports = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
grdr-ports-testkit = { workspace = true }
serde_json = { workspace = true }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
arithmetic_side_effects = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
exit = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Rpc",
    "Win32_System_Threading",
    "Win32_System_Time",
] }
