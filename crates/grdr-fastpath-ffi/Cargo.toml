[package]
name = "grdr-fastpath-ffi"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.grdr]
layer = 1
privilege = "none"
surface = "public"
renders = "none"

# A copy of the root [workspace.lints] with unsafe_code = "deny" in place of "forbid", so a
# reasoned #[allow(unsafe_code)] can admit one item. Keep it in step with the root table.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
exit = "deny"
