// Monitored user profiles and organisation privacy configuration (P8).
syntax = "proto3";

package grdr.api.tenancy.v1alpha1;

import "grdr/common/v1alpha1/enums.proto";
import "grdr/common/v1alpha1/resources.proto";
import "grdr/common/v1alpha1/types.proto";

// Request for ListUsers using AIP-158 cursor pagination and AIP-160 filters.
message ListUsersRequest {
  // Requested page size (default 50, maximum 1000).
  uint32 page_size = 1;
  // AEAD-sealed opaque page cursor token.
  string page_token = 2;
  // Bounded AIP-160 filter expression over filterable UserProfile fields.
  string filter = 3;
  // Sort specification over sortable UserProfile fields.
  string order_by = 4;
}

// Response for ListUsers.
message ListUsersResponse {
  // Current page of user profiles respecting active identity_mode.
  repeated grdr.common.v1alpha1.UserProfile users = 1;
  // AIP-158 cursor pagination metadata.
  grdr.common.v1alpha1.PageInfo page_info = 2;
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 3;
}

// Request for GetUser.
message GetUserRequest {
  // User identifier or pseudonym.
  string id = 1;
}

// Response for GetUser.
message GetUserResponse {
  // Detailed user profile.
  grdr.common.v1alpha1.UserProfile user = 1;
  // Devices attributed to this user.
  repeated grdr.common.v1alpha1.Device devices = 2;
  // Monitored sessions attributed to this user.
  repeated grdr.common.v1alpha1.SessionSummary sessions = 3;
  // Recent action attempts attributed to this user.
  repeated grdr.common.v1alpha1.ActionAttempt recent_attempts = 4;
  // Decision receipts attributed to this user.
  repeated grdr.common.v1alpha1.DecisionReceipt receipts = 5;
  // Findings attributed to this user.
  repeated grdr.common.v1alpha1.Finding findings = 6;
  // Artifacts attributed to this user.
  repeated grdr.common.v1alpha1.ArtifactEntry artifacts = 7;
  // Effective organisation identity mode applied when rendering this detail.
  grdr.common.v1alpha1.IdentityMode identity_mode = 8;
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 9;
}

// Request for GetPrivacyConfig.
message GetPrivacyConfigRequest {}

// Response for GetPrivacyConfig.
message GetPrivacyConfigResponse {
  // Effective organisation privacy visibility settings.
  grdr.common.v1alpha1.OrgPrivacyConfig config = 1;
  // Revision and ETag metadata.
  grdr.common.v1alpha1.RevisionMeta revision = 2;
}

// Request for UpdatePrivacyConfig.
message UpdatePrivacyConfigRequest {
  // Optional new identity mode (named or pseudonymous).
  optional grdr.common.v1alpha1.IdentityMode identity_mode = 1;
  // Optional toggle for additive risk scoring.
  optional bool user_risk_scoring = 2;
  // Optional actor attribution.
  optional string actor = 3;
}

// Response for UpdatePrivacyConfig.
message UpdatePrivacyConfigResponse {
  // Updated organisation privacy configuration.
  grdr.common.v1alpha1.OrgPrivacyConfig config = 1;
}

// Monitored developer profiles and works-council privacy visibility settings.
service UserService {
  // Lists monitored user profiles with keyset pagination and AIP-160 filters.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "users:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_SENSITIVE_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
    option (grdr.common.v1alpha1.mcp_exposed) = true;
  }

  // Returns detailed devices, sessions, findings, and artifacts for a user.
  rpc GetUser(GetUserRequest) returns (GetUserResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "users:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_SENSITIVE_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_INTERACTIVE;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
  }

  // Returns the current organisation privacy visibility mode.
  rpc GetPrivacyConfig(GetPrivacyConfigRequest) returns (GetPrivacyConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (grdr.common.v1alpha1.scope) = "privacy:read";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_READ;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_STANDARD;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_NONE;
  }

  // Updates organisation privacy visibility or user risk scoring settings.
  rpc UpdatePrivacyConfig(UpdatePrivacyConfigRequest) returns (UpdatePrivacyConfigResponse) {
    option (grdr.common.v1alpha1.scope) = "privacy:write";
    option (grdr.common.v1alpha1.audit) = AUDIT_CLASS_CRITICAL_MUTATION;
    option (grdr.common.v1alpha1.rate_class) = RATE_CLASS_CRITICAL;
    option (grdr.common.v1alpha1.confirm) = CONFIRM_CLASS_CONSEQUENCE;
  }
}
