# Public surface stability classes (ADR-0020, D-60). Protected trust-core path: every public
# surface carries a class (experimental, beta or stable), and nothing becomes stable before
# one external embed pilot completes.
#
# [[c_header]] rows register C ABI headers for grdr-cabi-testkit and c-headers (RFC 0004,
# ADR-0034). Each entry sits on its own `key = "value"` line with one double-quoted string;
# profiles, features and targets are space-separated lists.

[[c_header]]
file = "grdr_fastpath.h"
crate = "grdr-fastpath-ffi"
contract = "spec/host-contract/c-abi.md"
section = "grdr_fastpath.h"
class = "experimental"
profiles = "release"
features = ""
targets = "x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc"

[[c_header]]
file = "grdr.h"
crate = "grdr-ffi"
contract = "spec/host-contract/c-abi.md"
section = "grdr.h"
class = "experimental"
profiles = "release"
features = ""
targets = "x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc"

# [[crate]] rows register public crate stability classes for cargo public-api and
# cargo semver-checks (RFC 0005, ADR-0020, ADR-0037). Each entry sits on its own
# `key = "value"` line with one double-quoted string (`name`, `class`, `rfc`). A class is
# per crate, never per module, and a crate's class is at most the class of every crate whose
# public types its public API exposes (`grdr-core` exposes `grdr_fastpath::layout::Nanos`,
# so it cannot move above `grdr-fastpath`).

[[crate]]
name = "grdr-fastpath"
class = "experimental"
rfc = "0005"

[[crate]]
name = "grdr-fastpath-ffi"
class = "experimental"
rfc = "0005"

[[crate]]
name = "grdr-core"
class = "experimental"
rfc = "0005"
