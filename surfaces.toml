# Public surface stability classes (ADR-0020, D-60). Protected trust-core path: every public
# surface carries a class (experimental, beta or stable), and nothing becomes stable before
# one external embed pilot completes.
#
# [[c_header]] rows register C ABI headers for grdr-cabi-testkit and c-headers (RFC 0004,
# ADR-0034). Each entry sits on its own `key = "value"` line with one double-quoted string;
# profiles, features and targets are space-separated lists.

[[c_header]]
file = "grdr_fastpath.h"
crate = "grdr-fastpath-ffi"
contract = "spec/host-contract/c-abi.md"
section = "grdr_fastpath.h"
class = "experimental"
profiles = "release"
features = ""
targets = "x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc"

[[c_header]]
file = "grdr.h"
crate = "grdr-ffi"
contract = "spec/host-contract/c-abi.md"
section = "grdr.h"
class = "experimental"
profiles = "release"
features = ""
targets = "x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-msvc aarch64-pc-windows-msvc"

# [[crate]] rows register public crate stability classes for cargo public-api and
# cargo semver-checks (RFC 0005, ADR-0020, ADR-0037). Each entry sits on its own
# `key = "value"` line with one double-quoted string (`name`, `class`, `rfc`). A class is
# per crate, never per module, and a crate's class is at most the class of every crate whose
# public types its public API exposes (`grdr-core` exposes `grdr_fastpath::layout::Nanos`,
# so it cannot move above `grdr-fastpath`).

[[crate]]
name = "grdr-fastpath"
class = "experimental"
rfc = "0005"

[[crate]]
name = "grdr-fastpath-ffi"
class = "experimental"
rfc = "0005"

[[crate]]
name = "grdr-core"
class = "experimental"
rfc = "0005"

# `grdr-ports` and `grdr-ports-testkit` share these `[[crate]]` rows under RFC 0008
# (ADR-0040, blob `b338780823870d0f81c92e1a6f9cd2a5ec472eb8`) and RFC 0002 (ADR-0033,
# blob `9f8430afa9c17178d402d3cf43c37f247a01370c`, amending RFC 0008's runner and adding
# the storage ports and test kit). `Monotonic` takes the `grdr-model` crate class.
# Promotion conditions for both `grdr-ports` and `grdr-ports-testkit`:
# - RFC 0008 constraint 2e (seat 5): neither crate leaves `experimental` until every
#   method later added to `Clock`, `Entropy` or `Health` is a provided method (or the
#   trait is sealed with a stated implementor route) and `RetryError` is
#   `#[non_exhaustive]` with a stated rule for the wildcard arm, stated in a promoting
#   amendment of RFC 0008.
# - RFC 0002 section 12: neither crate moves from `experimental` to `beta` until the
#   server's packages freeze (`design/03` section 7), gated on a promoting RFC (setting
#   the `beta` notice under ADR-0020) plus deployment-scoped objects Q1, the Keys port
#   RFC (`design/21` K2), and Q2 module-repository traits.

[[crate]]
name = "grdr-ports"
class = "experimental"
rfc = "0008"

[[crate]]
name = "grdr-ports-testkit"
class = "experimental"
rfc = "0008"

# `grdr-strings` carries a `[[crate]]` row under RFC 0017 (ADR-0055, blob
# `cabe7ab126651fbe22e55caf1be00cda4caa0fac`). `grdr-messages` is unpublished
# (`surface = "unpublished"`, generated) and `grdr-interface-gen` is `layer = "tool"`
# (`surface = "internal"`), so neither takes a `[[crate]]` row. `grdr-strings` exposes
# zero `icu*` or `zoneinfo64` types publicly (`ARCH-007`).
# Promotion conditions for `grdr-strings`:
# - RFC 0017 / ADR-0055: stays `experimental` until an amending RFC naming RFC 0017
#   promotes it, and cannot outrank `grdr-schema` or `grdr-model` types exposed in its
#   public API.
# - D-60 / ADR-0020: no surface moves to `stable` before one external embed pilot completes.

[[crate]]
name = "grdr-strings"
class = "experimental"
rfc = "0017"
