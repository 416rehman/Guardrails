name: Bug Report
description: Report a reproducible defect or regression in Guardrails ADR
title: "bug: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: >
        Do NOT report security vulnerabilities here. Use private advisory reporting per SECURITY.md.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clear description of the incorrect behaviour.
    validations:
      required: true
  - type: textarea
    id: reproducer
    attributes:
      label: Deterministic reproducer
      description: Exact command, input, or test case that fails cleanly.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OS, commit, or version
      placeholder: "Linux / macOS / Windows, commit SHA"
    validations:
      required: true
