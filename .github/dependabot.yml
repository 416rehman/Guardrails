# Dependency updates with no new account (owner instructions 22 and 23). Version updates wait
# 3 days after a patch or minor release and 7 after a major; security updates skip the cooldown
# and reach eval-security through the lane their diff earns. Grouping keeps the pull requests few;
# the merge queue lands each one under the title it carries. GitHub Actions cooldowns take one
# value for every update type, so actions use the patch and minor value. `.github/zizmor.yml`
# sets zizmor's cooldown minimum to the same 3 days.
# pnpm workspaces join as `npm` entries when web/ exists; Dependabot reads pnpm-lock.yaml.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3
    groups:
      cargo:
        applies-to: version-updates
        update-types: [minor, patch]
        patterns: ["*"]
      cargo-major:
        applies-to: version-updates
        update-types: [major]
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: fix
      include: scope
    labels: ["kind:dependency"]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "04:00"
      timezone: Etc/UTC
    cooldown:
      default-days: 3
    groups:
      actions:
        applies-to: version-updates
        patterns: ["*"]
      security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: ci
      include: scope
    labels: ["kind:dependency"]
    open-pull-requests-limit: 5
