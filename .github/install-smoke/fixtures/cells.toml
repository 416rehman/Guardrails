# Seeded fixture cells for oracle-self-test (R5 of #1650).
# Each cell injects one violation and must fail at its expected_fail_step.

[[cell]]
id = "writes-outside-ours"
runner = "ubuntu-26.04"
profile = "user"
expected_fail_step = "install"
build = "python3 -I -B .github/install-smoke/fixtures/fixture_cell.py writes-outside-ours build"
install = "python3 -I -B .github/install-smoke/fixtures/fixture_cell.py writes-outside-ours install"
choose = "python3 -I -B .github/install-smoke/fixtures/fixture_cell.py writes-outside-ours choose"
uninstall = "python3 -I -B .github/install-smoke/fixtures/fixture_cell.py writes-outside-ours uninstall"

