# The labels of this repository's issues. A work item is an issue and nothing else; its labels
# are its fields (owner instruction 5). An issue carries at most one priority:, tier:, squad:,
# kind:, size: and agent: label; a tier is raised, never lowered. There are no milestone or date
# labels and no work-item files. Apply a new or changed entry with `gh label create` or
# `gh label edit`.

# Priority, set by the programme manager to order the queue
[[label]]
name = "priority:p0"
color = "b60205"
description = "First: unblocks other items, or trust-core, security or release work"
[[label]]
name = "priority:p1"
color = "d93f0b"
description = "Next after p0"
[[label]]
name = "priority:p2"
color = "fbca04"
description = "Normal order"
[[label]]
name = "priority:p3"
color = "c2e0c6"
description = "When nothing above it is ready"

# Risk tier and trust core
[[label]]
name = "tier:low"
color = "c2e0c6"
description = "Low risk tier; docs and additive changes behind a flag"
[[label]]
name = "tier:medium"
color = "fbca04"
description = "Medium risk tier"
[[label]]
name = "tier:high"
color = "d93f0b"
description = "High risk tier: eval-security, eval-adversarial and a second model"
[[label]]
name = "meta"
color = "000000"
description = "Work on the agent environment itself"
[[label]]
name = "trust-core"
color = "7057ff"
description = "Touches security/trust-core.paths; two independent passing evaluators on different models"

