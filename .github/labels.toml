# Labels of the repository `.agents/harness.toml` [github] names. A work item is an issue and
# nothing else; its labels are its status and its fields (owner instruction 5). `cargo xtask
# labels sync` applies this file and `--check` runs in CI. There are no milestone or date labels,
# and no work-item files.
#
# [[group]] says how many labels of a prefix an issue carries and who may set them; guard-command
# enforces it on agents' gh calls. Roster names may be globs. "filer" is whoever creates the
# issue, at creation only. "kit" is `cargo xtask kit ready` and `kit handoff`, which change
# labels for the agent that runs them; "dispatcher" is `cargo xtask dispatch`.
# [[transition]] is the status state machine: no other status change is valid.

[[group]]
prefix = "status:"
count = "one"                    # exactly one on every open issue
filed_as = "status:proposed"     # the only status an issue may be created with

[[group]]
prefix = "priority:"
count = "at-most-one"
set_by = ["programme-manager", "product-lead", "lead-*", "chief-architect"]

[[group]]
prefix = "tier:"
count = "one-when-ready"
set_by = ["lead-*", "product-lead", "programme-manager", "chief-architect", "eval-tier"]
raise_only = true                # from `cargo xtask risk`; may be raised, never lowered

[[group]]
names = ["trust-core"]
count = "flag"
set_by = ["lead-*", "product-lead", "programme-manager", "chief-architect", "eval-tier"]
raise_only = true

[[group]]
prefix = "squad:"
count = "one-when-ready"
set_by = ["filer", "lead-*", "product-lead", "programme-manager", "chief-architect", "garden-intake"]

[[group]]
prefix = "kind:"
count = "one-when-ready"
set_by = ["filer", "lead-*", "product-lead", "programme-manager", "chief-architect", "garden-intake"]

[[group]]
prefix = "size:"
count = "one-when-ready"
set_by = ["filer", "lead-*", "product-lead", "programme-manager", "chief-architect"]

[[group]]
prefix = "agent:"
count = "one-when-ready"
set_by = ["filer", "lead-*", "product-lead", "programme-manager", "chief-architect"]

[[group]]
names = ["open-to-contributors", "good-first-issue", "extractive"]
count = "flag"
set_by = ["lead-*", "product-lead", "programme-manager"]   # the fleet never claims good-first-issue

[[group]]
names = ["perf-accepted"]
count = "flag"
set_by = ["lead-*"]              # after a second evaluator agreed; makes the change high tier

[[group]]
names = ["ui-baseline"]
count = "flag"
set_by = ["eval-ux"]             # allows the screenshot baselines to be regenerated

# release-please marks its release pull request with these (owner instruction 3); no agent sets
# or removes them, and a merged one left at pending blocks the next release pull request.
[[group]]
names = ["autorelease: pending", "autorelease: tagged"]
count = "flag"
set_by = []

# Readying needs a ready.v1 comment from the agent that readies, naming itself and the SHA-256
# of the acceptance-criteria section and of the write set; that agent is never the issue's agent:
# label.
[[transition]]
from = "proposed"
to = "ready"
by = ["kit"]
run_by = ["lead-*", "product-lead", "programme-manager"]
when = "spec, write set, acceptance criteria with named oracles and every *-when-ready label are present"

[[transition]]
from = "proposed"
to = "in-review"
by = ["kit"]
when = "the chief architect's seed session (GRDR_SCOPE=seed) hands off the agent/seed pull request for the [WI-0000] issue, with the lease that names that branch"

[[transition]]
from = "proposed"
to = "leased"
by = ["dispatcher"]
when = "the chief architect's decision moved the handed-off [WI-0000] issue back from escalated; the seed session starts again on agent/seed under a new lease while usage.toml [item] max_attempts allows"

[[transition]]
from = "proposed"
to = "blocked"
by = ["lead-*", "product-lead", "programme-manager"]
when = "an external precondition, named in the issue, must hold first"

[[transition]]
from = "proposed"
to = "closed"
by = ["lead-*", "product-lead", "programme-manager"]
when = "duplicate or will not be done; closed as not planned with the reason"

[[transition]]
from = "ready"
to = "leased"
by = ["dispatcher"]
when = "every blocked-by issue is closed and the acceptance and write-set digests match ready.v1"

[[transition]]
from = "ready"
to = "proposed"
by = ["dispatcher"]
when = "the acceptance section or the write set changed after readying; an edit by the implementer is a tamper finding"

[[transition]]
from = "leased"
to = "in-review"
by = ["dispatcher"]
when = "the pull request for agent/<n>/a<attempt> is open"

[[transition]]
from = "leased"
to = "ready"
by = ["dispatcher"]
when = "stall or failed attempt 1; the next lease raises the attempt"

[[transition]]
from = "leased"
to = "escalated"
by = ["dispatcher", "kit"]
when = "stall or failure on attempt 2, or a blocked hand-off carrying a team/01 section 6 packet; for the [WI-0000] issue, which nobody readies, any failure, a blocked or impossible hand-off of its seed session, or an acceptance-section change under its lease"

[[transition]]
from = "leased"
to = "blocked"
by = ["kit"]
when = "a blocked hand-off that waits on a named issue or external precondition; never the [WI-0000] issue's, which escalates"

[[transition]]
from = "leased"
to = "proposed"
by = ["kit", "dispatcher"]
when = "an impossible hand-off: the spec and the tests conflict, so the item returns to its spec author; or the acceptance section changed under the lease; never the [WI-0000] issue, which escalates"

[[transition]]
from = "in-review"
to = "leased"
by = ["dispatcher"]
when = "evaluator findings in a round before the last (usage.toml [item] max_review_rounds), or a merge-queue refusal: pull-request-invalid, checks-failed, verify-failed or merge-conflict"

[[transition]]
from = "in-review"
to = "proposed"
by = ["dispatcher"]
when = "the last review round failed on the first attempt, or the acceptance section changed after the lease (acceptance-changed), so evaluators did not judge the readied snapshot; the lead re-plans"

[[transition]]
from = "in-review"
to = "escalated"
by = ["dispatcher"]
when = "the last review round failed on the last attempt (usage.toml [item] max_attempts), usage above [item] escalate_above times the item's cap, [item] verdict_hours with no verdict, evaluators-on-one-model: the evaluators the lane needs ran on one model and the change needs two, or evaluator-unavailable: an evaluator the lane needs is not in the roster, has no model or may not run on the model asked; for the [WI-0000] issue, which nobody readies, also any failed last round, a merge conflict and acceptance-changed"

[[transition]]
from = "in-review"
to = "closed"
by = ["merge"]
when = "the merged pull request closes the issue; this is done"

[[transition]]
from = "blocked"
to = "ready"
by = ["dispatcher"]
when = "the precondition holds and a valid ready.v1 exists"

[[transition]]
from = "blocked"
to = "proposed"
by = ["lead-*", "product-lead", "programme-manager"]
when = "the precondition holds and the issue has no valid ready.v1"

[[transition]]
from = "escalated"
to = "proposed"
by = ["lead-*", "product-lead", "programme-manager", "chief-architect"]
when = "the decision is recorded: the lead's or the chief architect's answer, or the packet's default after 48 hours"

[[transition]]
from = "escalated"
to = "closed"
by = ["lead-*", "product-lead", "programme-manager", "chief-architect"]
when = "the decision abandons the item; closed as not planned"

# Status

[[label]]
name = "status:proposed"
color = "c5def5"
description = "Filed; a lead adds spec, write set, acceptance criteria and labels, then readies it"

[[label]]
name = "status:ready"
color = "0e8a16"
description = "Readied with a valid ready.v1 comment; the dispatcher may lease it"

[[label]]
name = "status:leased"
color = "1d76db"
description = "Leased to one implementer; the lease comment names agent, attempt and digest"

[[label]]
name = "status:in-review"
color = "5319e7"
description = "Pull request open; evaluators and the merge queue hold it"

[[label]]
name = "status:blocked"
color = "b60205"
description = "Waits on a precondition or issue named in the issue"

[[label]]
name = "status:escalated"
color = "d93f0b"
description = "Needs a decision; a comment holds the team/01 section 6 packet"

