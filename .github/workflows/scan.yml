name: scan

# Proactive vulnerability work that needs no account (owner instructions 22 and 23): secrets with
# gitleaks, workflows with zizmor, lockfiles with osv-scanner and source with Semgrep OSS rules.
# Tool versions and image digests come from security/supply-chain/build-tools.toml. GitHub's secret scanning
# with push protection, a setting of the public repository, backs gitleaks up on every push (owner
# instruction 28).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: Secrets (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - id: pins
        uses: $/.github/actions/pins
        with:
          tool: gitleaks
          keys: image config
      - name: Scan the new commits, or the whole history on a schedule
        env:
          IMAGE: ${{ steps.pins.outputs.image }}
          CONFIG: ${{ steps.pins.outputs.config }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          range=""
          if [ -n "$PR_BASE" ]; then range="$PR_BASE..$PR_HEAD"; fi
          if [ -z "$range" ] && [ -n "$PUSH_BEFORE" ] && [ -n "${PUSH_BEFORE//0/}" ]; then range="$PUSH_BEFORE..$PUSH_AFTER"; fi
          args=(git --redact --no-banner --exit-code 1 "--config=/repo/$CONFIG")
          if [ -n "$range" ]; then args+=("--log-opts=$range"); fi
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/repo" "$IMAGE" "${args[@]}" /repo

  zizmor:
    name: Workflows (zizmor)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - id: pins
        uses: $/.github/actions/pins
        with:
          tool: zizmor
          keys: version
      - uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          version: ${{ steps.pins.outputs.version }}
          advanced-security: false
          annotations: true

  pins:
    name: Pin reader (seeded fixtures)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - run: python3 -I .github/actions/pins/test_read_pins.py

  osv-scanner:
    name: Dependencies (osv-scanner)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - name: Scan workspace and web dependencies (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=security/osv-scanner.toml
            --x-exclude=r:(?:^|/)desktop/grdr-desktop$
            --recursive
            ./
      - name: Scan desktop dependencies (osv-scanner)
        uses: google/osv-scanner-action/osv-scanner-action@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
        with:
          scan-args: |-
            --config=desktop/grdr-desktop/osv-scanner.toml
            --recursive
            desktop/grdr-desktop

  semgrep:
    name: Source (Semgrep OSS)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - id: semgrep
        uses: $/.github/actions/pins
        with:
          tool: semgrep
          keys: image
      - id: rules
        uses: $/.github/actions/pins
        with:
          tool: semgrep-rules
          keys: repository commit severities
      - name: Run the Rust rules, and the TypeScript rules once web/ exists
        env:
          IMAGE: ${{ steps.semgrep.outputs.image }}
          RULES_REPO: ${{ steps.rules.outputs.repository }}
          RULES_COMMIT: ${{ steps.rules.outputs.commit }}
          SEVERITIES: ${{ steps.rules.outputs.severities }}
        run: |
          rules_dir="$(mktemp -d)"
          trap 'rm -rf "$rules_dir"' EXIT
          git -c core.hooksPath=/dev/null init -q "$rules_dir"
          git -C "$rules_dir" -c core.hooksPath=/dev/null fetch --depth=1 --no-tags "https://github.com/${RULES_REPO}.git" "$RULES_COMMIT"
          git -C "$rules_dir" -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD
          chmod -R a+rX "$rules_dir"
          configs=(--config /rules/rust)
          if [ -d web ]; then configs+=(--config /rules/typescript --config /rules/javascript); fi
          levels=()
          for severity in $SEVERITIES; do levels+=(--severity "$severity"); done
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp -v "$PWD:/src:ro" -v "$rules_dir:/rules:ro" -w /src "$IMAGE" \
            semgrep scan --metrics=off --error --disable-version-check \
            --exclude third_party --exclude target \
            "${levels[@]}" "${configs[@]}"

  advisories-and-vex:
    name: PSIRT advisories, OpenVEX, CSAF, and FIPS policy
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - name: Validate advisories, VEX/CSAF generator, and FIPS policy
        run: |
          python3 -I -B security/advisories/generate_advisories.py --check-dir security/advisories/records
          python3 -I -B security/advisories/test_advisories.py -v
          python3 -I -B deploy/release/release_tools.py check-config
          python3 -I -B deploy/release/test_release_tools.py -v

  grype-sbom:
    name: Grype vulnerability pin verification and container SBOM check
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - id: grype-pin
        uses: $/.github/actions/pins
        with:
          tool: grype
          keys: version
      - name: Generate CycloneDX workspace SBOM and run pinned Grype scan
        env:
          GRYPE_VERSION: ${{ steps.grype-pin.outputs.version }}
        run: |
          python3 -I -B deploy/release/release_tools.py verify-containerfile \
            --path deploy/release/fips/Containerfile.server-fips
          python3 -I -B deploy/release/release_tools.py generate-workspace-sbom \
            --out workspace.cdx.json \
            --version dev \
            --os linux \
            --target x86_64-unknown-linux-gnu \
            --fips
          python3 -I -B deploy/release/release_tools.py cross-check-sbom \
            --sbom workspace.cdx.json \
            --target x86_64-unknown-linux-gnu \
            --fips
          python3 -I -B deploy/release/release_tools.py install-grype \
            --version "$GRYPE_VERSION" \
            --dest "$RUNNER_TEMP/grype-bin"
          "$RUNNER_TEMP/grype-bin/grype" "sbom:workspace.cdx.json" -o json > grype-workspace.json
          python3 -I -B deploy/release/release_tools.py check-grype-report --report grype-workspace.json
