name: docs

# The docs rules of design/34 a script can check, on every pull request: code changes with its
# docs, the release note, front matter on docs pages and no third-party requests from the site.
# .claude/hooks/docs-check.mjs holds the rules and runs inside Claude Code and Antigravity sessions
# too. The job also runs the tests of .claude/hooks/branch-check.mjs, ci-stop.mjs and
# agy-pre-tool-use.mjs.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

concurrency:
  group: docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs rules of design/34
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BODY: ${{ github.event.pull_request.body }}
        run: node .claude/hooks/docs-check.mjs --ci
      - run: node --test .claude/hooks/branch-check.test.mjs .claude/hooks/ci-stop.test.mjs .agents/hooks/agy-pre-tool-use.test.mjs
