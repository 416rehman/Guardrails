name: branch-check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  workflow_dispatch:

permissions: {}

concurrency:
  group: branch-check
  cancel-in-progress: false

jobs:
  branch-check:
    name: Branch hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .claude/hooks
            .github/actions/tree-paths
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .claude/hooks/branch-check.mjs
