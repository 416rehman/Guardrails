name: release-please

# Decoupled versions (owner instruction 3): release-please keeps the release pull request open
# against main and, once the merge queue lands it, creates each component's tag and GitHub
# release itself (owner instruction 7). Tags made with the workflow token start no other
# workflow, so the artefacts of the released crates are packaged, signed and attested here.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  components:
    name: Configured components
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.count.outputs.configured }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: release-please-config.json
          sparse-checkout-cone-mode: false
      - id: count
        run: |
          count=$(jq '.packages | length' release-please-config.json)
          echo "configured=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    needs: components
    if: needs.components.outputs.configured == 'true'
    name: Release pull request, tags and releases (once a component is configured)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases: ${{ steps.released.outputs.releases }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - id: released
        env:
          OUTPUTS: ${{ toJSON(steps.release-please.outputs) }}
        run: |
          releases=$(jq -c '[to_entries[]
            | select(.key == "tag_name" or (.key | endswith("--tag_name")))
            | {path: (if .key == "tag_name" then "." else (.key | rtrimstr("--tag_name")) end), tag: .value}]' <<< "$OUTPUTS")
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  artefacts:
    needs: release
    # Every release is signed and attested, since the repository is public (owner instruction 28).
    # Sigstore's public transparency log records the repository and workflow identity, and GitHub
    # artifact attestations need a public repository on the free plan, so a private copy, such as a
    # self-hosted mirror, skips this job.
    if: needs.release.outputs.releases != '[]' && github.event.repository.private == false
    name: Package, sign and attest the released crates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - id: pins
        run: >-
          python3 -I -c 'import sys, tomllib;
          tool = tomllib.load(open(sys.argv[1], "rb"))["tool"][sys.argv[2]];
          print("\n".join(f"{k}={v}" for k, v in tool.items() if isinstance(v, str)))'
          supply-chain/build-tools.toml cosign >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ steps.pins.outputs.version }}
      - name: Package the released crates
        env:
          RELEASES: ${{ needs.release.outputs.releases }}
        run: |
          crates=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -c '[.packages[] | {name, dir: (.manifest_path | sub("/Cargo.toml$"; ""))}]')
          args=()
          while IFS= read -r path; do
            name=$(jq -r --arg dir "$GITHUB_WORKSPACE/$path" '.[] | select(.dir == $dir) | .name' <<< "$crates")
            if [ -z "$name" ]; then
              echo "::error::$path is not a workspace crate; its artefacts come from the release workflow of design/24 section 10"
              exit 1
            fi
            args+=(--package "$name")
          done < <(jq -r '.[].path' <<< "$RELEASES")
          cargo package --locked --no-verify "${args[@]}"
      - name: Sign with Sigstore keyless
        run: |
          for crate in target/package/*.crate; do
            cosign sign-blob --yes --bundle "$crate.sigstore.json" "$crate"
          done
      - id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate
      - name: Attach artefacts to the releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASES: ${{ needs.release.outputs.releases }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          while IFS= read -r tag; do
            crate="target/package/${tag%-v*}-${tag##*-v}.crate"
            cp "$PROVENANCE" "$crate.provenance.sigstore.json"
            gh release upload "$tag" "$crate" "$crate.sigstore.json" "$crate.provenance.sigstore.json" --clobber
          done < <(jq -r '.[].tag' <<< "$RELEASES")
