name: release-please

# Decoupled versions (owner instruction 3): release-please keeps the release pull request open
# against main and, once it is squash-merged, creates each component's tag and GitHub
# release itself (owner instruction 7). Tags made with the workflow token start no other
# workflow, so crate artefacts and the multi-OS release bundle run here via release.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  components:
    name: Configured components
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      configured: ${{ steps.count.outputs.configured }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - id: count
        run: |
          python3 -I -B deploy/release/release_tools.py check-config
          count=$(jq '.packages | length' deploy/release/release-please-config.json)
          echo "configured=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    needs: components
    if: needs.components.outputs.configured == 'true'
    name: Release pull request, tags and releases
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      releases: ${{ steps.released.outputs.releases }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - id: release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: deploy/release/release-please-config.json
          manifest-file: deploy/release/.release-please-manifest.json
      - id: released
        env:
          OUTPUTS: ${{ toJSON(steps.release-please.outputs) }}
        run: |
          releases=$(jq -c '[to_entries[]
            | select(.key == "tag_name" or (.key | endswith("--tag_name")))
            | {path: (if .key == "tag_name" then "." else (.key | rtrimstr("--tag_name")) end), tag: .value}]' <<< "$OUTPUTS")
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  artefacts:
    needs: release
    if: needs.release.outputs.releases != '[]' && github.event.repository.private == false && github.ref == 'refs/heads/main'
    name: Package, sign and attest released Cargo crates
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - id: pins
        uses: $/.github/actions/pins
        with:
          tool: cosign
          keys: version
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: ${{ steps.pins.outputs.version }}
      - id: pkg-crates
        env:
          RELEASES: ${{ needs.release.outputs.releases }}
        run: |
          crates=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -c '[.packages[] | {name, version, dir: (.manifest_path | sub("/Cargo.toml$"; ""))}]')
          args=()
          : > crate-map.tsv
          while IFS='|' read -r path tag; do
            [ -z "$path" ] && continue
            if [ "$path" = "." ]; then
              target_dir="$GITHUB_WORKSPACE"
            else
              target_dir="$GITHUB_WORKSPACE/$path"
            fi
            match=$(jq -r --arg dir "$target_dir" '.[] | select(.dir == $dir) | "\(.name)|\(.version)"' <<< "$crates")
            if [ -n "$match" ]; then
              pkg_name="${match%%|*}"
              pkg_ver="${match#*|}"
              args+=(--package "$pkg_name")
              printf '%s|%s|%s\n' "$pkg_name" "$pkg_ver" "$tag" >> crate-map.tsv
            fi
          done < <(jq -r '.[] | "\(.path)|\(.tag)"' <<< "$RELEASES")
          if [ "${#args[@]}" -gt 0 ]; then
            cargo package --locked --no-verify "${args[@]}"
            while IFS='|' read -r pkg_name pkg_ver tag; do
              [ -z "$pkg_name" ] && continue
              crate="target/package/${pkg_name}-${pkg_ver}.crate"
              if [ ! -f "$crate" ]; then
                echo "::error::expected packaged crate $crate missing for tag $tag"
                exit 1
              fi
              cosign sign-blob --yes --bundle "$crate.sigstore.json" "$crate"
            done < crate-map.tsv
            echo "has_crates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_crates=false" >> "$GITHUB_OUTPUT"
          fi
      - id: provenance
        if: steps.pkg-crates.outputs.has_crates == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: target/package/*.crate
      - name: Attach crate artefacts to releases
        if: steps.pkg-crates.outputs.has_crates == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROVENANCE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          if [ ! -f "$PROVENANCE" ]; then
            echo "::error::missing SLSA provenance bundle at $PROVENANCE"
            exit 1
          fi
          while IFS='|' read -r pkg_name pkg_ver tag; do
            [ -z "$pkg_name" ] && continue
            crate="target/package/${pkg_name}-${pkg_ver}.crate"
            if [ ! -f "$crate" ] || [ ! -f "$crate.sigstore.json" ]; then
              echo "::error::missing signed crate archive for $pkg_name@$pkg_ver ($tag)"
              exit 1
            fi
            cp "$PROVENANCE" "$crate.provenance.sigstore.json"
            gh release upload "$tag" "$crate" "$crate.sigstore.json" "$crate.provenance.sigstore.json" --clobber
          done < crate-map.tsv

  multi-os-release:
    needs: release
    if: needs.release.outputs.releases != '[]' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      releases_json: ${{ needs.release.outputs.releases }}
      channel: broad
