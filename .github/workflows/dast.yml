name: dast

# An OWASP ZAP baseline scan of the console and API against the embedded server (owner
# instruction 22). deploy/ci/dast.toml holds the start command, readiness URL, and targets
# with explicit auth mode ('none' or 'console-bearer') so protected endpoints keep failing closed
# with 401 unauthenticated while authenticated scans use an ephemeral per-run token passed via
# a 0600 env-file.

on:
  push:
    branches: [main]
  schedule:
    - cron: "19 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dast-${{ github.ref }}
  cancel-in-progress: false

jobs:
  server:
    name: Server targets defined
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - id: check
        run: |
          python3 -I - <<'PY'
          import re, tomllib
          from pathlib import Path
          plan = tomllib.loads(Path("deploy/ci/dast.toml").read_text("utf-8"))
          assert plan.get("ready_url"), "dast.toml missing ready_url"
          targets = plan.get("target", [])
          assert len(targets) >= 1, "dast.toml must configure at least one target"
          allowed_auth = {"none", "console-bearer"}
          name_re = re.compile(r"^[a-z0-9][a-z0-9-]*\Z")
          for target in targets:
              name = str(target.get("name", ""))
              assert name_re.match(name), f"invalid DAST target name {name!r}"
              auth = target.get("auth", "none")
              assert auth in allowed_auth, f"unsupported DAST target auth {auth!r} for {name}"
              rules = target.get("rules", "")
              if rules:
                  assert ".." not in Path(rules).parts and not Path(rules).is_absolute(), f"invalid rules path {rules!r}"
          print(f"verified dast.toml with {len(targets)} target(s)")
          PY
          echo "present=$([ -f deploy/ci/dast.toml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  baseline:
    needs: server
    if: needs.server.outputs.present == 'true'
    name: ZAP baseline (once the server and deploy/ci/dast.toml exist)
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - id: pins
        uses: $/.github/actions/pins
        with:
          tool: zap
          keys: image
      - name: Start server, verify auth boundaries, and run ZAP baseline scan
        env:
          IMAGE: ${{ steps.pins.outputs.image }}
          LOG: ${{ runner.temp }}/server.log
          REPORTS: ${{ runner.temp }}/zap
          ZAP_HOME: ${{ runner.temp }}/zap-home
          TOKEN_FILE: ${{ runner.temp }}/dast-api.token
          PID_FILE: ${{ runner.temp }}/dast-server.pid
          AUTH_ENV_FILE: ${{ runner.temp }}/zap-auth.env
        run: |
          umask 077
          mkdir -p "$REPORTS" "$ZAP_HOME"
          chmod 0700 "$REPORTS" "$ZAP_HOME"
          cleanup() {
            if [ -f "$PID_FILE" ]; then
              srv_pid="$(cat "$PID_FILE" 2>/dev/null || true)"
              if [ -n "$srv_pid" ]; then
                python3 -I -c "import os, signal, sys; os.killpg(int(sys.argv[1]), signal.SIGTERM)" "$srv_pid" 2>/dev/null || kill "$srv_pid" 2>/dev/null || true
              fi
              rm -f "$PID_FILE"
            fi
            rm -f "$TOKEN_FILE" "$AUTH_ENV_FILE"
            rm -rf "$ZAP_HOME"
          }
          trap cleanup EXIT

          python3 -I - deploy/ci/dast.toml "$LOG" "$TOKEN_FILE" "$PID_FILE" <<'EOF'
          import os, pathlib, secrets, signal, subprocess, sys, time, tomllib, urllib.error, urllib.request
          plan = tomllib.load(open(sys.argv[1], "rb"))
          token = secrets.token_hex(32)
          print(f"::add-mask::{token}", flush=True)
          token_path = pathlib.Path(sys.argv[3])
          fd = os.open(token_path, os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(fd, "w", encoding="utf-8") as tf:
              tf.write(token)
          env = dict(os.environ)
          env["GRDR_API_TOKEN"] = token
          log = open(sys.argv[2], "wb")
          proc = subprocess.Popen(plan["start"], env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
          pid_fd = os.open(pathlib.Path(sys.argv[4]), os.O_WRONLY | os.O_CREAT | os.O_TRUNC, 0o600)
          with os.fdopen(pid_fd, "w", encoding="utf-8") as pf:
              pf.write(str(proc.pid))
          ok = False
          try:
              deadline = time.monotonic() + plan["ready_timeout_seconds"]
              ready = False
              while time.monotonic() < deadline:
                  try:
                      with urllib.request.urlopen(plan["ready_url"], timeout=plan["ready_poll_seconds"]) as response:
                          if response.status == 200:
                              ready = True
                              break
                  except OSError:
                      pass
                  time.sleep(plan["ready_poll_seconds"])
              if not ready:
                  print(f"::error::the server was not ready at {plan['ready_url']} in time; see the server log artefact")
                  sys.exit(1)

              for target in plan["target"]:
                  url = target["url"]
                  auth = target.get("auth", "none")
                  if auth == "console-bearer":
                      try:
                          urllib.request.urlopen(url, timeout=10)
                          print(f"::error::protected DAST target {target['name']} allowed unauthenticated access")
                          sys.exit(1)
                      except urllib.error.HTTPError as err:
                          if err.code != 401:
                              print(f"::error::expected HTTP 401 unauthenticated for {target['name']}, got {err.code}")
                              sys.exit(1)
                      req = urllib.request.Request(url, headers={"Authorization": f"Bearer {token}"})
                      with urllib.request.urlopen(req, timeout=10) as resp:
                          if resp.status != 200:
                              print(f"::error::expected HTTP 200 authenticated for {target['name']}, got {resp.status}")
                              sys.exit(1)
                  else:
                      with urllib.request.urlopen(url, timeout=10) as resp:
                          if resp.status != 200:
                              print(f"::error::expected HTTP 200 unauthenticated for {target['name']}, got {resp.status}")
                              sys.exit(1)
              print("verified public targets (200) and protected targets (401 unauth / 200 bearer)")
              ok = True
          finally:
              if not ok:
                  try:
                      os.killpg(proc.pid, signal.SIGTERM)
                  except OSError:
                      proc.terminate()
          EOF

          dast_token="$(cat "$TOKEN_FILE")"
          rm -f "$TOKEN_FILE"
          install -m 0600 /dev/null "$AUTH_ENV_FILE"
          {
            printf 'ZAP_AUTH_HEADER=Authorization\n'
            printf 'ZAP_AUTH_HEADER_SITE=127.0.0.1:8787\n'
            printf 'ZAP_AUTH_HEADER_VALUE=Bearer %s\n' "$dast_token"
          } > "$AUTH_ENV_FILE"
          unset dast_token
          status=0
          while IFS='|' read -r name url rules auth; do
            if ! [[ "$name" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
              echo "::error::invalid DAST target name '$name'"
              status=1
              continue
            fi
            args=(zap-baseline.py -t "$url" -I -J "$name.json" -r "$name.html")
            if [ "$rules" != "none" ]; then
              cp "$rules" "$REPORTS/$name.rules.tsv"
              args+=(-c "$name.rules.tsv")
            fi
            docker_env=()
            if [ "$auth" = "console-bearer" ]; then
              docker_env=(--env-file "$AUTH_ENV_FILE")
            fi
            docker run --rm --network host \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp \
              -e JAVA_TOOL_OPTIONS=-Duser.home=/tmp \
              "${docker_env[@]}" \
              -v "$ZAP_HOME:/tmp:rw" \
              -v "$REPORTS:/zap/wrk:rw" \
              "$IMAGE" "${args[@]}" || status=1
          done < <(python3 -I - deploy/ci/dast.toml <<'PY'
          import sys, tomllib
          for t in tomllib.load(open(sys.argv[1], "rb"))["target"]:
              rules = t.get("rules") or "none"
              auth = t.get("auth") or "none"
              print(f"{t['name']}|{t['url']}|{rules}|{auth}")
          PY
          )
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dast
          path: |
            ${{ runner.temp }}/zap/
            ${{ runner.temp }}/server.log
          if-no-files-found: ignore
