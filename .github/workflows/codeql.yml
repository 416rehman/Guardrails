name: codeql

# CodeQL for Rust, TypeScript and the workflows (owner instruction 22), on every pull request,
# every push to main and weekly, since the repository is public (owner instruction 28). CodeQL's
# terms allow automated analysis only of open-source code in a public repository, and GitHub code
# scanning is free only there, so the visibility check skips the analysis on a private copy, such
# as a self-hosted mirror.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "12 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    name: Visibility and languages
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      public: ${{ steps.plan.outputs.public }}
      languages: ${{ steps.plan.outputs.languages }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          visibility=$(gh api "repos/$REPOSITORY" --jq .visibility)
          # CodeQL fails a language it finds no source for, so Rust joins once a crate lands.
          languages='["actions"'
          if [ -n "$(git ls-files '*.rs')" ]; then languages="$languages, \"rust\""; fi
          if [ -f pnpm-workspace.yaml ]; then languages="$languages, \"javascript-typescript\""; fi
          languages="$languages]"
          {
            echo "public=$([ "$visibility" = public ] && echo true || echo false)"
            echo "languages=$languages"
          } >> "$GITHUB_OUTPUT"

  analyze:
    needs: repository
    if: needs.repository.outputs.public == 'true'
    name: CodeQL ${{ matrix.language }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.repository.outputs.languages) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: ${{ matrix.language == 'rust' }}
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          category: /language:${{ matrix.language }}
