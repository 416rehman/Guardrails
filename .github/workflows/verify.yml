name: verify

# The quality gate: rustfmt, clippy, the tests and cargo-deny, the same commands a session runs
# before it pushes. Pull requests run on Linux. The repository is public, so pushes to main, the
# nightly run and a manual run cover Linux, macOS and Windows on GitHub's free standard runners
# (owner instruction 28); a private copy falls back to Linux with no nightly run, because private
# runner minutes are limited. Until a crate lands under crates/ or programs/ the workspace has no
# members, Cargo refuses every command, and the Rust steps are skipped.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan the run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      systems: ${{ steps.plan.outputs.systems }}
      run: ${{ steps.plan.outputs.run }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          LINUX: '["ubuntu-26.04"]'
          ALL_SYSTEMS: '["ubuntu-26.04", "macos-26", "windows-2025"]'
        run: |
          visibility=$(gh api "repos/$REPOSITORY" --jq .visibility)
          systems="$LINUX"
          if [ "$visibility" = public ] && [ "$EVENT" != pull_request ]; then systems="$ALL_SYSTEMS"; fi
          run=true
          if [ "$EVENT" = schedule ] && [ "$visibility" != public ]; then run=false; fi
          rust=false
          if compgen -G "crates/*/Cargo.toml" > /dev/null || compgen -G "programs/*/Cargo.toml" > /dev/null; then rust=true; fi
          {
            echo "systems=$systems"
            echo "run=$run"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"

  rust:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.rust == 'true'
    name: fmt, clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked

  deny:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.rust == 'true'
    name: cargo-deny
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
