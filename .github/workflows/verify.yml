name: verify

# The quality gate: rustfmt, clippy, the tests and cargo-deny, the same commands a session runs
# before it pushes. Pull requests run on Linux. The repository is public, so pushes to main, the
# nightly run and a manual run cover Linux, macOS and Windows on GitHub's free standard runners
# (owner instruction 28); a private copy falls back to Linux with no nightly run, because private
# runner minutes are limited. Until a crate lands under crates/ or programs/ the workspace has no
# members, Cargo refuses every command, and the Rust steps are skipped. The plan job runs
# .github/actions/tree-paths/check_tree.py on the commit, and every job that checks out calls
# the .github/actions/tree-paths action for the pinned toolchain. The tools job installs the
# release-asset build tools by digest on the same systems whether or not a crate exists.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan the run
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      systems: ${{ steps.plan.outputs.systems }}
      run: ${{ steps.plan.outputs.run }}
      rust: ${{ steps.plan.outputs.rust }}
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      # A refused path fails this job, and every job that needs it is skipped.
      - name: Check the paths of the commit's tree
        run: python3 -I -B .github/actions/tree-paths/check_tree.py --rev HEAD
      - name: Check release config, advisories, and support.toml CI matrix drift
        run: |
          python3 -I -B deploy/release/release_tools.py check-config
          python3 -I -B deploy/release/release_tools.py support-matrix --check-workflow .github/workflows/release.yml
          python3 -I -B deploy/release/test_release_tools.py -v
          python3 -I -B security/advisories/generate_advisories.py --check-dir security/advisories/records
          python3 -I -B security/advisories/test_advisories.py -v
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          LINUX: '["ubuntu-26.04"]'
          ALL_SYSTEMS: '["ubuntu-26.04", "macos-26", "windows-2025"]'
        run: |
          visibility=$(gh api "repos/$REPOSITORY" --jq .visibility)
          systems="$LINUX"
          if [ "$visibility" = public ] && [ "$EVENT" != pull_request ]; then systems="$ALL_SYSTEMS"; fi
          run=true
          if [ "$EVENT" = schedule ] && [ "$visibility" != public ]; then run=false; fi
          rust=false
          if compgen -G "crates/*/Cargo.toml" > /dev/null || compgen -G "programs/*/Cargo.toml" > /dev/null; then rust=true; fi
          {
            echo "systems=$systems"
            echo "run=$run"
            echo "rust=$rust"
          } >> "$GITHUB_OUTPUT"

  tree-paths:
    name: Tree, matcher and toolchain readers (seeded fixtures)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - name: Fetch main for the matcher's differential corpus
        run: git fetch --no-tags --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - run: python3 -I -B -m unittest discover -s .github/actions/tree-paths -p "test_*.py" -v

  rust:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.rust == 'true'
    name: fmt, clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - name: Verify FIPS crypto self-test across FIPS-enabled packages on Linux and Windows
        if: matrix.os != 'macos-26'
        run: cargo test -p grdr-crypto -p grdr -p grdr-daemon -p grdr-server -p grdr-updater --locked --features fips

  deny:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.rust == 'true'
    name: cargo-deny
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        with:
          command: check
          arguments: --all-features --config security/deny.toml
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        with:
          command: check
          arguments: --all-features --config security/deny.embedded.toml
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        with:
          command: check
          manifest-path: fuzz/Cargo.toml
          arguments: --all-features --config fuzz/deny.toml
      - name: Check GPL control fixture
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        with:
          command: check
          manifest-path: security/supply-chain/fixtures/deny/gpl-crate-control/Cargo.toml
          arguments: --all-features --config security/deny.toml
          command-arguments: bans licenses sources
      - name: Check banned-crate control fixture
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        with:
          command: check
          manifest-path: security/supply-chain/fixtures/deny/banned-crate-control/Cargo.toml
          arguments: --all-features --config security/deny.toml
          command-arguments: bans licenses sources
      - name: Check git-source control fixture
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        with:
          command: check
          manifest-path: security/supply-chain/fixtures/deny/git-source-control/Cargo.toml
          arguments: --all-features --config security/deny.toml
          command-arguments: bans licenses sources
      - id: neg-gpl
        name: Reject seeded GPL crate fixture
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        with:
          command: check
          manifest-path: security/supply-chain/fixtures/deny/gpl-crate/Cargo.toml
          arguments: --all-features --config security/deny.toml
          command-arguments: licenses
      - id: neg-banned
        name: Reject seeded banned crate fixture
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        with:
          command: check
          manifest-path: security/supply-chain/fixtures/deny/banned-crate/Cargo.toml
          arguments: --all-features --config security/deny.toml
          command-arguments: bans
      - id: neg-mpl
        name: Reject seeded MPL-2.0 embedded closure fixture
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2.1.3
        env:
          RUSTUP_TOOLCHAIN: ${{ env.RUSTUP_TOOLCHAIN }}
        with:
          command: check
          manifest-path: security/supply-chain/fixtures/deny/mpl-closure/Cargo.toml
          arguments: --all-features --config security/deny.embedded.toml
          command-arguments: licenses
      - name: Assert negative cargo-deny fixtures failed as required
        env:
          NEG_GPL: ${{ steps.neg-gpl.outcome }}
          NEG_BANNED: ${{ steps.neg-banned.outcome }}
          NEG_MPL: ${{ steps.neg-mpl.outcome }}
        run: |
          test "$NEG_GPL" = "failure"
          test "$NEG_BANNED" = "failure"
          test "$NEG_MPL" = "failure"

  contracts-and-helm:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    name: Architecture lint, licence lint, and Helm verification
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: toolchain
        uses: $/.github/actions/tree-paths
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Fetch main for licence diff baseline
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
      - name: Run architecture, licence, and Helm checks
        run: |
          node scripts/check-architecture.mjs
          node scripts/licence-lint.mjs
          if command -v helm >/dev/null 2>&1; then
            helm lint deploy/helm/grdr-server --set image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
            helm lint deploy/helm/grdr-node-sensor --set image.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
          fi

  cargo-vet-and-unsafe:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.rust == 'true'
    name: Supply-chain vet store and trust-core unsafe checks
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Verify cargo-vet store metadata and unsafe-register test suites
        run: |
          test -f security/supply-chain/config.toml
          test -f security/supply-chain/audits.toml
          test -f security/supply-chain/imports.lock
          cargo test -p grdr-fastpath-ffi -p grdr-ffi -p grdr-ipc-os -p grdr-crypto --locked
          if [ -n "$(sed '/^#/d;/^\[/d;/^$/d' security/supply-chain/imports.lock)" ] && command -v cargo-vet >/dev/null 2>&1; then
            cargo vet --locked --no-all-features
          fi

  tools:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    name: tools (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.systems) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
        with:
          install: "false"
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - name: Compare the pins with GitHub's asset digests
        if: matrix.os == 'ubuntu-26.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I .github/actions/install-tool/install_tool.py buf --check-release
          python3 -I .github/actions/install-tool/install_tool.py protoc-gen-connect-openapi --check-release
      - name: Installer, signature, proxy-name and no-build-fetch tests
        run: |
          for python in python3 python; do
            if "$python" -I -c "import tomllib" > /dev/null 2>&1; then
              "$python" -I -B .github/actions/install-tool/test_install_tool.py -v
              exit 0
            fi
          done
          echo "::error::GRDR-GATE-0006 no Python with tomllib on this runner"
          exit 1
      - id: buf
        uses: $/.github/actions/install-tool
        with:
          tool: buf
      - id: openapi
        uses: $/.github/actions/install-tool
        with:
          tool: protoc-gen-connect-openapi
      - name: Run both tools from the folder the action output
        env:
          BUF_FOLDER: ${{ steps.buf.outputs.path }}
          OPENAPI_FOLDER: ${{ steps.openapi.outputs.path }}
        run: |
          "$BUF_FOLDER/buf" --version
          "$OPENAPI_FOLDER/protoc-gen-connect-openapi" --version

  qa-e2e:
    needs: plan
    if: needs.plan.outputs.run == 'true' && needs.plan.outputs.rust == 'true'
    name: web console Playwright E2E (live grdr-server)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: toolchain
        uses: $/.github/actions/tree-paths
      - name: Write RUSTUP_TOOLCHAIN to GITHUB_ENV
        shell: bash
        env:
          CHANNEL: ${{ steps.toolchain.outputs.channel }}
        run: echo "RUSTUP_TOOLCHAIN=${CHANNEL:?}" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --locked --bin grdr-server
      - name: Build Web Console and run live Playwright E2E
        run: |
          if ! command -v pnpm >/dev/null 2>&1; then
            mkdir -p "$HOME/.local/bin"
            corepack enable --install-directory "$HOME/.local/bin"
            corepack prepare pnpm@10.6.1 --activate
            export PATH="$HOME/.local/bin:$PATH"
          fi
          pnpm --dir web install --frozen-lockfile
          pnpm --dir web run typecheck
          pnpm --dir web run test
          pnpm --dir web run build
          pnpm --dir web exec playwright install chromium --with-deps
          pnpm --dir web run test:e2e
