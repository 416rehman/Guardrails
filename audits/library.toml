# Power-prompt registry (docs/team/04). `cargo xtask audit` reads it from the base branch; README.md
# says how. Gate configuration under D-63: a change is a trust-core work item. Model names resolve
# through .agents/models.toml; token caps per trigger window are .agents/kit/usage.toml's
# [routine.audit-*] rows and the usage brake its [audit_brake].

[files]
preamble = "preamble.md"
verifier = "verifier.md"
prompt = "prompts/{id}.md"
finding_schema = "schema/audit-finding.v1.json"
run_schema = "schema/audit-run.v1.json"

[defaults]
max_findings = 15
finder_model = "sonnet"            # design/_review/03: find passes on Sonnet 5.5
finder_effort = "medium"
verifier_model = "opus"            # refuting passes on Opus 5.5 in a clean context (D-47)
verifier_effort = "high"
second_verifier_model = "sonnet"   # severity 1 adds a clean-context Sonnet verifier, so two models look
prover_model = "opus"
overlap_model = "sonnet"           # advisory overlap judgement (team/04 section 6)
finder_max_turns = 40
verifier_max_turns = 20
prover_max_turns = 40
usage_cap_tokens = 750_000         # per run; a run's cap is the lower of this and its trigger's per-run cap
control_concept = "Find the bugs in {scope}."
control_pairing = { first_runs = 8, then_every = 4, every_run_when_only = ["w4", "release", "model-upgrade"] }
shadow_days = 14                   # a new or major-bumped prompt files no issues and blocks nothing

[rules]
allowed_models = ["opus", "sonnet"]   # no audit pass runs on fable

# Where results go. The repositories are created under the owner's profile when this work starts
# (owner instruction 5); until then the runner writes the ledger to `local` and says so.
[ledger]
public = "416rehman/audit-ledger"
private = "416rehman/audit-ledger-private"   # security candidates under embargo (D-62)
local = ".agent/audit-ledger"

# A security candidate goes to the private ledger only: never an issue, comment or pull request.
[embargo]
severity = 1                          # any severity 1 result
themes = ["security"]                 # any S-theme result
theme_severity = { boundaries = 2 }   # B-theme results at severity 2 or worse

# Upheld results that are not security candidates become GitHub issues (owner instructions 5 and 6).
[issues]
repository = "416rehman/Guardrails"
labels = ["status:proposed", "kind:gardening"]   # plus squad:<owner of the locus> from .agents/owners.toml
max_per_week = 8                     # team/04 section 6; prompts with always_file are not held back
rank = ["severity", "proof", "trust-core"]
title = "[{prompt_id}] {title}"
fingerprint_line = "Audit-Fingerprint: {fingerprint}"
closure_line = "Closes by: {closes_by}"

[release_gate]
blocking_states = ["open", "upheld", "triage", "proven", "regressed"]   # per prompt: release_gate = worst severity that blocks

# Triggers (team/04 section 9). `scope` is the default scope kind of a run on that trigger.
[trigger.pr]
cadence = "pull-request"
scope = "diff"
routine = "audit-pr"                 # per-run and per-pull-request caps, at most six power runs
started_by = "eval-diff"             # inside the `review` workflow, first and final rounds
order = ["M01", "M02", "M03", "M04", "M05"]   # then library order; the rest are recorded as skipped
forks = "merge-queue"                # pull requests from forks are audited when they enter the queue

[trigger.nightly]
cadence = "nightly"
scope = "rotation"
routine = "audit-nightly"
started_by = "garden-architecture"
security_rotation = ["M01", "M02", "M03", "M04", "M05"]   # one a night

[trigger.weekly]
cadence = "weekly"
scope = "repo"                       # the five crates with the most churn when the tree does not fit the cap
churn_crates = 5
routine = "audit-weekly"
started_by = "garden-architecture"

[trigger.w4]
cadence = "every-fourth-week"
scope = "repo"
routine = "audit-weekly"             # inside the weekly cap
started_by = "garden-architecture"
buckets = 4

[trigger.release]
cadence = "release"
scope = "release-head"               # findings diffed against the previous release
routine = "audit-release"
started_by = "release workflow"

[trigger.model-upgrade]
cadence = "model-upgrade"
scope = "kit"
routine = "audit-model-upgrade"
started_by = "lead-agent-kit"
adopt_when = { max_recall_loss_points = 10 }   # Y01; the new model is not used for audits before

[trigger.incident]
cadence = "incident"
scope = "repo"
routine = "audit-incident"
started_by = "incident review"

# Diff shapes a pull-request filter can require, beyond paths. The runner matches them with
# ast-grep on the changed items; `line_regex` (Rust regex, on added and removed lines) is the
# fallback until those rules exist, and errs toward running the prompt.
[shape.type-field]
description = "A field of a struct, enum variant, union, class, interface or type literal is added, removed, renamed or retyped"
line_regex = '^\s*(pub(\([^)]*\))?\s+|readonly\s+|(public|private|protected)\s+)?[A-Za-z_][A-Za-z0-9_]*\??\s*:\s*[^:=\s]|^\s*[A-Z][A-Za-z0-9]*\s*(\{|\(|,|=\s*\d)'

[shape.status-like-field]
description = "A field, variable or parameter whose name is, or ends in, one of `names` is added or changed"
names = ["state", "status", "phase", "stage", "mode"]   # owner instruction 4, the same list as grdr-structure S4
line_regex = '(?i)\b[a-z0-9_]*(state|status|phase|stage|mode)\??\s*[:=]'

[shape.match-on-status-like]
description = "A match, switch or if-let whose scrutinee is a status-like field is added or changed"
line_regex = '(?i)\b(match|switch)\b[^{]*\b[a-z0-9_]*(state|status|phase|stage|mode)\b|\bif\s+let\b[^{]*=\s*[^{]*\b[a-z0-9_]*(state|status|phase|stage|mode)\b'

[shape.test-code]
description = "Test code is added or changed: test directories, test files, #[cfg(test)] modules, test functions"
paths = ["**/tests/**", "**/benches/**", "fuzz/**", "**/*.test.ts", "**/*.test.tsx", "**/*.spec.ts", "**/*.spec.tsx"]
line_regex = '#\[(test|tokio::test|rstest|proptest|cfg\(test\))|\b(assert|assert_eq|assert_ne|debug_assert|prop_assert|proptest)!|\b(it|test|describe)\('

[shape.logging-or-error]
description = "Logging, Debug or Display output, or error types and messages are added or changed"
line_regex = '\b(tracing|log)::|\b(trace|debug|info|warn|error|println|eprintln)!\(|#\[derive\([^)]*\bDebug\b|\bimpl\b.*\b(Display|Debug|Error)\b\s+for\b|#\[error\(|\bLogSafe\b|support[-_]bundle'

[shape.async-code]
description = "Async code, locks, channels or task spawns are added or changed"
line_regex = '\basync\b|\.await\b|\bselect!|\b(Mutex|RwLock|Semaphore|Notify|mpsc|oneshot|broadcast)\b|\bspawn(_blocking|_local)?\('

[shape.removal-claim]
description = "The pull-request title, body or a commit subject claims a removal"
text_regex = '(?i)\b(remove[sd]?|removal|delete[sd]?|deletion|drop(s|ped)?)\b'

# Nightly rotation (team/04 section 9). The runner takes the next entry whose paths exist, so the
# cycle grows as crates arrive; the pull request that adds a crate adds it here (work item 10).
[[rotation]]
name = "grdr-hook"
paths = ["programs/grdr-hook/**"]

[[rotation]]
name = "grdr-core::session"
paths = ["crates/grdr-core/src/session.rs", "crates/grdr-core/src/session/**"]

[[rotation]]
name = "grdr-core::policy with grdr-policy-ref"
paths = ["crates/grdr-core/src/policy.rs", "crates/grdr-core/src/policy/**", "crates/grdr-policy-ref/**"]

[[rotation]]
name = "grdr-core::analyze"
paths = ["crates/grdr-core/src/analyze.rs", "crates/grdr-core/src/analyze/**"]

[[rotation]]
name = "grdr-fastpath"
paths = ["crates/grdr-fastpath/**"]

[[rotation]]
name = "grdr-wire"
paths = ["crates/grdr-wire/**"]

[[rotation]]
name = "grdr-daemon"
paths = ["programs/grdr-daemon/**"]

[[rotation]]
name = "grdr-engine"
paths = ["programs/grdr-engine/**"]

[[rotation]]
name = "grdr-agents"
paths = ["crates/grdr-agents/**"]

[[rotation]]
name = "grdr-update with grdr-updater"
paths = ["crates/grdr-update/**", "programs/grdr-updater/**"]

[[rotation]]
name = "grdr-store-local"
paths = ["crates/grdr-store-local/**"]

[[rotation]]
name = "grdr-sensor-linux"
paths = ["crates/grdr-sensor-linux/**"]

[[rotation]]
name = "grdr-sensor-macos"
paths = ["crates/grdr-sensor-macos/**"]

[[rotation]]
name = "grdr-sensor-windows"
paths = ["crates/grdr-sensor-windows/**"]

[[rotation]]
name = "grdr-proxy with grdr-mcp"
paths = ["programs/grdr-proxy/**", "programs/grdr-mcp/**"]

[[rotation]]
name = "grdr-sandbox-*"
paths = ["crates/grdr-sandbox-*/**"]

[[rotation]]
name = "grdr-server targets"
paths = ["programs/grdr-server/**"]

[[rotation]]
name = "web/"
paths = ["web/**"]

# Prompts (team/04 sections 7 and 8). Unset keys take [defaults]. `paths` and `pr_shape` filter
# pull requests; `scope` overrides a trigger's default scope kind; `bucket` places a w4 prompt.

# 7.1 State and invariants

[[prompt]]
id = "A01"
name = "implicit-state-machines"
title = "Implicit state machines"
version = "1.0.0"
theme = "state"
triggers = ["pr", "nightly", "weekly"]   # pr and weekly whole tree by owner instruction 4
paths = ["**/*.rs", "**/*.ts", "**/*.tsx", "**/*.swift"]
pr_shape = ["type-field", "status-like-field", "match-on-status-like"]
pr_priority = "never-skip"         # funded first from the per-pull-request cap; not one of the six
blocking = "major"                 # a surviving PR finding fails eval-diff
closes-by = ["type"]               # owner instruction 4: never a comment, flag, guard or test alone
always_file = true                 # every surviving scheduled finding becomes an issue
shadow_days = 0
finder_effort = "high"
usage_cap_tokens = 1_500_000

[[prompt]]
id = "A02"
name = "lifecycle-delta"
title = "Lifecycle delta"
version = "1.0.0"
theme = "state"
triggers = ["pr"]
paths_from = "docs/state-machines/*.md"   # each machine document lists its paths in front matter
closes-by = ["type", "test"]

[[prompt]]
id = "A03"
name = "reachable-illegal-transitions"
title = "Reachable illegal transitions"
version = "1.0.0"
theme = "state"
triggers = ["nightly", "weekly"]
after = "A01"                      # runs on the machines the A01 run of the same trigger upheld
scope = { nightly = "machines", weekly = "machines" }
params = ["name"]
closes-by = ["test"]
finder_effort = "high"

[[prompt]]
id = "A04"
name = "unenforced-invariants"
title = "Unenforced invariants"
version = "1.0.0"
theme = "state"
triggers = ["weekly"]
closes-by = ["test", "type"]

[[prompt]]
id = "A05"
name = "representable-illegal-states"
title = "Representable illegal states"
version = "1.0.0"
theme = "state"
triggers = ["pr", "w4"]
bucket = 1
paths = ["crates/grdr-model/**", "proto/**"]
closes-by = ["type"]

[[prompt]]
id = "A06"
name = "dual-sources-of-truth"
title = "Dual sources of truth"
version = "1.0.0"
theme = "state"
triggers = ["weekly"]
closes-by = ["type", "test"]

[[prompt]]
id = "A07"
name = "primitive-obsession"
title = "Primitive obsession"
version = "1.0.0"
theme = "state"
triggers = ["w4"]
bucket = 1
closes-by = ["type"]

