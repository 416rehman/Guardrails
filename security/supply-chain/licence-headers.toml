# The two-line SPDX header every source file starts with (D-02, design/30 section 1). The licence
# lint (30-02) reads these rules; licences.toml stays the licence policy. A new language is one
# [comment] entry and a new path licence one [[path]] entry, each reviewed by eval-licence.
#
# A file passes when, byte for byte:
# - it does not start with a UTF-8 BOM;
# - line 1, or the line after a shebang, is `<prefix> SPDX-License-Identifier: <expression>` and
#   the next line is `<prefix> SPDX-FileCopyrightText: <holder>`, each ending in LF with no CR
#   and no trailing space; identifiers, operators and holder keep their exact case;
# - <expression> equals the whole expression its path takes, not one identifier of it;
# - no other line of the file contains `SPDX-License-Identifier`.
#
# Paths are relative to the repository root, with `/` between folders. A glob is anchored at the
# root and matches the whole path: `*` matches within one folder name, `**` matches zero or more
# folders, and matching is exact case.
schema = "grdr.licence-headers.v1"

# Every identifier in an expression below must appear in one of the [[class]] lists there.
licences = "security/supply-chain/licences.toml"

# The text of the SPDX-FileCopyrightText line, read from the brand manifest (D-66).
copyright = { file = "contracts/interface/brand/brand.toml", key = "legal.copyright_holder" }

default_expression = "Apache-2.0"

# A file whose first line starts with one of these prefixes carries the header on lines 2 and 3,
# with no blank line before it. `#![` is a Rust inner attribute, not a shebang.
shebang_first = true
shebang_prefixes = ["#!/", "#! "]

# Paths the header rules skip.
exempt = [
  # Vendored files keep their upstream header.
  "third_party/**",
  # The licence lint's fixtures break these rules on purpose. Other gates' fixtures take headers.
  "security/supply-chain/fixtures/licence-lint/**",
]

# Paths the GPL check skips. It still runs on third_party/: a GPL identifier outside bpf/ fails
# there too (design/30 section 1).
gpl_exempt = ["security/supply-chain/fixtures/licence-lint/**"]

# The line-comment prefix per file extension. Only these extensions take a header. The extension
# is looked up ignoring case, since `LIB.RS` still compiles and `x.JS` still loads; path globs and
# the GPL allowance stay exact case.
[comment]
rs = "//"
mjs = "//"
js = "//"
cjs = "//"
ts = "//"
tsx = "//"
swift = "//"
c = "//"
h = "//"
proto = "//"
py = "#"
sh = "#"
ps1 = "#"

# A GPL identifier is allowed only in a glob under a prefix of gpl_allowed_under in licences.toml,
# and only in a file whose path starts with that prefix, in exact case as the globs are.
[[path]]
glob = "bpf/**"
expression = "GPL-2.0-only OR BSD-2-Clause"
