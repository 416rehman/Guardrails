# gitleaks rules for this repository: the default rule set plus two allowlists. scan.yml passes
# this file through [tool.gitleaks] config in build-tools.toml. A finding in history stays in
# every whole-history scan, so a false positive is allowed here rather than edited out of a file.
[extend]
useDefault = true

# The design docs' examples use typed identifiers: a short lowercase type, an underscore and a
# ULID, such as rty_01jcdqb2f7x1y0b8z5w2r9t4v6 in design/04. They are ids, not credentials, but
# generic-api-key matches them when the field name contains "token".
[[allowlists]]
description = "typed ULID identifiers in the docs' examples"
condition = "AND"
regexTarget = "secret"
regexes = ['''^[a-z]{2,8}_01[0-9a-hjkmnp-tv-z]{24}$''']
paths = ['''^docs/''']

# Buf's minisign_key in build-tools.toml is the release-signing public key Buf publishes, not a
# credential, but generic-api-key matches it. The entry is scoped to that rule, with AND, because a
# global entry's paths would skip the whole file in dir mode and an OR entry would allow any value.
[[allowlists]]
description = "minisign public keys in the build-tool pins"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^RW[QRST][A-Za-z0-9+/]{53}$''']
paths = ['''^security/supply-chain/build-tools\.toml$''']

# Demo seed and Vitest fixtures use synthetic grdr_wk_* wave deployment key previews/stubs.
[[allowlists]]
description = "synthetic wave deployment key previews in demo seed and test fixtures"
targetRules = ["generic-api-key"]
condition = "AND"
regexTarget = "secret"
regexes = ['''^grdr_wk_(?:pilot_9f1a|mac_48c2|old_03b7|pilot9f1a|fin12345|fin123456789abcdef)$''']
paths = [
  '''^crates/grdr-model/src/connect\.rs$''',
  '''^programs/grdr-server/src/store/connect_mdm\.rs$''',
  '''^web/tests/console\.test\.tsx$''',
]
