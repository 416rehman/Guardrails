[package]
name = "grdr-sensor-linux-bpf"
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only OR BSD-2-Clause"

# Outside the root workspace (its `exclude`); this table stops Cargo looking for an enclosing one.
[workspace]

[package.metadata.grdr]
layer = 3
privilege = "privileged"
surface = "internal"
renders = "none"

# A copy of the root [workspace.lints] with unsafe_code = "deny" in place of "forbid", so a
# reasoned #[allow(unsafe_code)] can admit one item. Keep it in step with the root table.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
panic_in_result_fn = "deny"
exit = "deny"
