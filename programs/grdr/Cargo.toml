[package]
name = "grdr"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.grdr]
layer = 4
privilege = "untrusted"
surface = "internal"
renders = "person"

[dependencies]
clap = { workspace = true }
grdr-agents = { workspace = true }
grdr-core = { workspace = true }
grdr-llm-proto = { workspace = true }
grdr-model = { workspace = true }
grdr-sandbox-engine = { workspace = true }
jiff = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "charset"] }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
