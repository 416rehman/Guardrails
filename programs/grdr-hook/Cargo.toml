[package]
name = "grdr-hook"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.grdr]
layer = 4
privilege = "untrusted"
surface = "internal"
renders = "agent"

[dependencies]
clap = { workspace = true }
grdr-agents = { workspace = true }
grdr-model = { workspace = true }
jiff = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "charset"] }
uuid = { workspace = true }

[lints]
workspace = true
