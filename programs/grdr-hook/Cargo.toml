[package]
name = "grdr-hook"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.grdr]
layer = 4
privilege = "untrusted"
surface = "cli"
renders = "text,json"

[dependencies]
clap = { workspace = true }
grdr-crypto = { workspace = true }
grdr-fastpath = { workspace = true }
grdr-ipc-os = { workspace = true }
grdr-os-clock = { workspace = true }
grdr-peer-os = { workspace = true }
grdr-wire = { workspace = true, default-features = false }
jiff = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
