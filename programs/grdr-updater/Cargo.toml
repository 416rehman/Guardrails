[package]
name = "grdr-updater"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[package.metadata.grdr]
layer = 4
privilege = "privileged"
surface = "internal"
renders = "none"

[features]
default = []
fips = ["grdr-crypto/fips"]

[dependencies]
clap = { workspace = true }
grdr-compat = { workspace = true }
grdr-crypto = { workspace = true }
grdr-ipc-os = { workspace = true }
grdr-model = { workspace = true }
grdr-os-clock = { workspace = true }
grdr-os-service = { workspace = true }
grdr-peer-os = { workspace = true }
grdr-store-local = { workspace = true }
grdr-update = { workspace = true }
grdr-wire = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
uuid = { workspace = true }

[lints]
workspace = true
