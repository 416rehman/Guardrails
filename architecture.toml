# The layer table, the same-layer edges and the ARCH-004 decoders of design/03 section 2, as data
# the architecture lint (design/03 A2, #1580) reads beside `cargo metadata`. A crate depends only
# on lower layers plus the rule and edges listed here; adding an edge is an RFC (D-61). Each
# created crate's `[package.metadata.grdr]` repeats its layer, and the two must agree. Gate
# configuration under D-63.

[layers]
0 = "schema"
1 = "core"
2 = "ports and shared libraries"
3 = "adapters"
4 = "programs"
tool = "test and tool crates"

# May depend on any layer; nothing depends on one except as a dev-dependency, and none is linked
# into a layer 4 program (ARCH-001, design/03 section 2).
[tool]
depends_on = "any"
dependents_only_as = "dev"
linked_into_programs = false

# Every crate of design/03 section 2. `created = false` marks one the workspace does not have yet.
# A `member = false` crate sits outside the workspace, so `cargo metadata` of the root does not
# list it and `manifest` locates it.

[crates.grdr-proto]
layer = 0
created = true

[crates.grdr-schema]
layer = 0
created = true

[crates.grdr-model]
