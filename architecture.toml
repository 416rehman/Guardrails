# Families design/03 section 2 names by prefix ("other grdr-sandbox-*", "grdr-judge-*"). A crate
# listed by name above wins over its family.

[families."grdr-sandbox-*"]
layer = 3

[families."grdr-judge-*"]
layer = 3

# The complete same-layer edge list. Layers 3 and 4 have none: adapters meet only in a program, and
# no program depends on another.

# Every crate of the layer, created now or later, except those listed, may depend on `to`.
[[same_layer_rule]]
layer = 1
to = "grdr-model"
except = ["grdr-fastpath", "grdr-fastpath-ffi"]

[[same_layer_edge]]
from = "grdr-schema"
to = "grdr-proto"

[[same_layer_edge]]
from = "grdr-core"
to = "grdr-fastpath"
scope = "table layout and the cost function only"
importers = ["compile::fastpath"]
paths = ["grdr_fastpath::layout"]

[[same_layer_edge]]
from = "grdr-fastpath-ffi"
to = "grdr-fastpath"
scope = "its only dependency"

[[same_layer_edge]]
from = "grdr-ffi"
to = "grdr-core"

[[same_layer_edge]]
from = "grdr-ffi"
to = "grdr-fastpath"

[[same_layer_edge]]
from = "grdr-wasm"
to = "grdr-core"

[[same_layer_edge]]
from = "grdr-wasm"
to = "grdr-fastpath"

[[same_layer_edge]]
from = "grdr-ports-testkit"
to = "grdr-ports"

[[same_layer_edge]]
from = "grdr-wire"
to = "grdr-crypto"

[[same_layer_edge]]
from = "grdr-messages"
to = "grdr-strings"

# ARCH-004 (ADR-0010): the closure of every `privilege = "privileged"` program and of the programs
# named here holds none of `content_parsers`, except the decoders below. `grdr-agents` holds the
# hook dialect translators; `grdr-update` is admitted only where its decoder entry says.
[arch004]
also_programs = ["grdr-hook"]
content_parsers = ["grdr-core", "grdr-llm-proto", "grdr-mcp-proto", "grdr-agents", "grdr-update", "cedar-policy", "yara-x", "rsigma-*", "serde_json", "regex"]

# A decoder is admitted in the closures `only_in` names, or in every closure ARCH-004 checks when
# it has no `only_in`. `admits` lists the content parsers it may bring with it there; nothing else
# in its own closure is exempt.
[[arch004.decoder]]
crate = "grdr-proto"
decodes = "IPC frames, through the generated protobuf codec"
admits = []

[[arch004.decoder]]
crate = "grdr-update"
decodes = "TUF metadata"
only_in = ["grdr-updater"]
admits = ["serde_json"]

# ARCH-017 (RFC 0005, ADR-0037): per-leaf-variant bindings for `no_std` error types with no
# `grdr-schema` dependency. Wrapper variants (`Error::Arg`, `Error::Bundle`) take no entry.
# `status` is the single source of the leaf-to-status mapping (P17); `code` is the reason
# registered in area `FASTPATH`. Each row uses `key = "value"` lines for the row reader.

[[arch017.entry]]
type = "grdr_fastpath::ArgFault"
variant = "Arena"
registry = "spec/host-contract/status-codes.toml"
status = "GRDR_E_ARG"
bound_in = "grdr-fastpath-ffi"
coded_by = "grdr-daemon"
code = "ARENA_TOO_SHORT"

[[arch017.entry]]
type = "grdr_fastpath::ArgFault"
variant = "ActionClass"
registry = "spec/host-contract/status-codes.toml"
status = "GRDR_E_ARG"
bound_in = "grdr-fastpath-ffi"
coded_by = "grdr-daemon"
code = "ACTION_CLASS_INVALID"

[[arch017.entry]]
type = "grdr_fastpath::ArgFault"
variant = "PrincipalKind"
registry = "spec/host-contract/status-codes.toml"
status = "GRDR_E_ARG"
bound_in = "grdr-fastpath-ffi"
coded_by = "grdr-daemon"
code = "PRINCIPAL_KIND_INVALID"

[[arch017.entry]]
type = "grdr_fastpath::ArgFault"
variant = "Path"
registry = "spec/host-contract/status-codes.toml"
status = "GRDR_E_ARG"
bound_in = "grdr-fastpath-ffi"
coded_by = "grdr-daemon"
code = "PATH_INVALID"

[[arch017.entry]]
type = "grdr_fastpath::ArgFault"
variant = "Destination"
registry = "spec/host-contract/status-codes.toml"
status = "GRDR_E_ARG"
bound_in = "grdr-fastpath-ffi"
coded_by = "grdr-daemon"
code = "DESTINATION_INVALID"

[[arch017.entry]]
type = "grdr_fastpath::ArgFault"
variant = "Reason"
registry = "spec/host-contract/status-codes.toml"
status = "GRDR_E_ARG"
bound_in = "grdr-fastpath-ffi"
coded_by = "grdr-daemon"
code = "REASON_INDEX_INVALID"

[[arch017.entry]]
type = "grdr_fastpath::Error"
variant = "Abi"
registry = "spec/host-contract/status-codes.toml"
status = "GRDR_E_ABI"
bound_in = "grdr-fastpath-ffi"
coded_by = "grdr-daemon"
code = "ABI_MISMATCH"

[[arch017.entry]]
type = "grdr_fastpath::BundleFault"
variant = "Rule"
registry = "spec/host-contract/status-codes.toml"
status = "GRDR_E_BUNDLE"
bound_in = "grdr-fastpath-ffi"
coded_by = "grdr-daemon"
code = "BUNDLE_RULE_FAILED"

[[arch017.entry]]
type = "grdr_fastpath::BundleFault"
variant = "EvalCap"
registry = "spec/host-contract/status-codes.toml"
status = "GRDR_E_BUNDLE"
bound_in = "grdr-fastpath-ffi"
