name: "grdr-server"
arch: "${NFPM_ARCH}"
platform: "linux"
version: "${GRDR_VERSION}"
release: "1"
section: "Security"
maintainer: "${GRDR_MAINTAINER:-Guardrails ADR Packagers <packaging@localhost>}"
description: |
  Guardrails ADR self-hosted API server, Console UI, and Operator Plane host.
vendor: "${GRDR_VENDOR:-Loonaro}"
homepage: "${GRDR_HOMEPAGE:-https://github.com/416rehman/Guardrails}"
license: "Apache-2.0"

rpm:
  group: "Applications/System"
  compression: "zstd"

contents:
  - src: "${GRDR_BIN_DIR}/grdr-server"
    dst: "/usr/bin/grdr-server"
    file_info:
      mode: 0755
  - src: "deploy/packaging/systemd/grdr-server.service"
    dst: "/usr/lib/systemd/system/grdr-server.service"
    file_info:
      mode: 0644
  - src: "deploy/packaging/systemd/sysusers.d/grdr-server.conf"
    dst: "/usr/lib/sysusers.d/grdr-server.conf"
    file_info:
      mode: 0644
  - src: "${GRDR_WEB_DIR:-web}/dist"
    dst: "/usr/share/grdr/web"
    type: tree
    file_info:
      mode: 0644
  - src: "${GRDR_WEB_DIR:-web}/dist-operator"
    dst: "/usr/share/grdr/operator-web"
    type: tree
    file_info:
      mode: 0644
  - dst: "/etc/grdr-server"
    type: dir
    file_info:
      owner: grdr-server
      group: grdr-server
      mode: 0750
  - dst: "/var/lib/grdr-server"
    type: dir
    file_info:
      owner: grdr-server
      group: grdr-server
      mode: 0750

scripts:
  postinstall: "deploy/packaging/rpm/scripts/postinstall-server.sh"
  preremove: "deploy/packaging/rpm/scripts/preremove-server.sh"
