{{- if .Values.serviceAccount.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "grdr-server.fullname" . }}-lease
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdr-server.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "grdr-server.fullname" . }}-lease
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdr-server.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "grdr-server.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "grdr-server.fullname" . }}-lease
{{- end }}
