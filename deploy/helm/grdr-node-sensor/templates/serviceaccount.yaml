{{- include "grdr-node-sensor.validate" . -}}
{{- if .Values.serviceAccount.create }}
{{- $isDaemonSet := and .Values.daemonset.enabled (or (eq .Values.mode "daemonset") (eq .Values.mode "hybrid")) -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "grdr-node-sensor.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdr-node-sensor.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ $isDaemonSet }}
{{- end }}
