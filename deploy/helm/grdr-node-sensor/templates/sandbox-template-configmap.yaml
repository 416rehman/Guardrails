{{- if and .Values.sidecar.enabled .Values.sidecar.sandboxTemplateConfigMap.enabled }}
{{- include "grdr-node-sensor.validate" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grdr-node-sensor.fullname" . }}-sandbox-template
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdr-node-sensor.labels" . | nindent 4 }}
data:
  sandbox-pod-overlay.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      labels:
        {{ .Values.sidecar.sandboxTemplateConfigMap.agentSandboxLabelKey }}: "true"
    spec:
      runtimeClassName: {{ .Values.sidecar.sandboxTemplateConfigMap.runtimeClassName | quote }}
      automountServiceAccountToken: false
      containers:
        - name: grdr-node-sensor
          image: {{ include "grdr-node-sensor.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "--profile"
            - "user"
            - "--data-dir"
            - "/var/lib/guardrails/data"
            - "--state-dir"
            - "/var/lib/guardrails/state"
          env:
            - name: HOME
              value: "/var/lib/guardrails"
            - name: GRDR_DATA_DIR
              value: "/var/lib/guardrails/data"
            - name: GRDR_STATE_DIR
              value: "/var/lib/guardrails/state"
            - name: XDG_RUNTIME_DIR
              value: "/var/lib/guardrails/run"
            {{- if .Values.server.endpoint }}
            - name: GRDR_SERVER_URL
              value: {{ .Values.server.endpoint | quote }}
            {{- end }}
            {{- if .Values.server.enrollExistingSecret }}
            - name: GRDR_ENROLL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.enrollExistingSecret }}
                  key: enroll-token
            {{- end }}
            {{- if .Values.server.caConfigMap }}
            - name: SSL_CERT_FILE
              value: "/etc/grdr/certs/ca.crt"
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.sidecar.resources | nindent 12 }}
          volumeMounts:
            - name: grdr-tmp
              mountPath: /tmp
            - name: grdr-state
              mountPath: /var/lib/guardrails
            {{- if .Values.server.caConfigMap }}
            - name: server-ca
              mountPath: /etc/grdr/certs
              readOnly: true
            {{- end }}
      volumes:
        - name: grdr-tmp
          emptyDir: {}
        - name: grdr-state
          emptyDir: {}
        {{- if .Values.server.caConfigMap }}
        - name: server-ca
          configMap:
            name: {{ .Values.server.caConfigMap }}
        {{- end }}
{{- end }}
