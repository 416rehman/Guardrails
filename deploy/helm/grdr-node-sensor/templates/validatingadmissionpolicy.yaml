{{- if and .Values.sidecar.enabled .Values.sidecar.validatingPolicy.enabled }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ include "grdr-node-sensor.fullname" . }}-require-sidecar
  labels:
    {{- include "grdr-node-sensor.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  validations:
    - expression: >
        object.metadata.labels == null ||
        !({{ .Values.sidecar.sandboxTemplateConfigMap.agentSandboxLabelKey | quote }} in object.metadata.labels) ||
        object.metadata.labels[{{ .Values.sidecar.sandboxTemplateConfigMap.agentSandboxLabelKey | quote }}] != "true" ||
        object.spec.containers.exists(c, c.name == "grdr-node-sensor")
      message: "Agent sandbox pods must include the unprivileged grdr-node-sensor sidecar container"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ include "grdr-node-sensor.fullname" . }}-require-sidecar
  labels:
    {{- include "grdr-node-sensor.labels" . | nindent 4 }}
spec:
  policyName: {{ include "grdr-node-sensor.fullname" . }}-require-sidecar
  validationActions:
    {{- toYaml .Values.sidecar.validatingPolicy.validationActions | nindent 4 }}
  matchResources:
    namespaceSelector:
      matchLabels:
        {{ .Values.sidecar.sandboxTemplateConfigMap.agentNamespaceLabelKey }}: "enabled"
{{- end }}
