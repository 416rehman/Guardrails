apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grdr-node-sensor.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "grdr-node-sensor.labels" . | nindent 4 }}
data:
  sensor.toml: |
    mode = {{ .Values.mode | quote }}

    [uplink]
    endpoint = {{ .Values.server.endpoint | quote }}

    [cri]
    socket_path = {{ .Values.daemonset.criSocketPath | quote }}
