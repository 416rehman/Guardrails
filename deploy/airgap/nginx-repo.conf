# Hardened TLS site repository mirror configuration for Guardrails ADR air-gap deployments.
# Serves offline TUF metadata (role-split caching), APT/RPM packages, and verified target assets.

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name repo.site.internal;

    ssl_certificate     /etc/grdr/tls/repo.crt;
    ssl_certificate_key /etc/grdr/tls/repo.key;
    ssl_protocols       TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;

    root /var/lib/grdr/mirror;
    autoindex off;

    # Mutable TUF timestamp and rollout metadata must never be cached.
    location ~ ^/tuf/(?:timestamp\.json|rollout\.json)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Content-addressed and version-pinned immutable TUF roots, snapshots, and targets.
    location ~ ^/tuf/(?:[0-9]+\.(?:root|snapshot|targets|binaries)\.json|sha256-[0-9a-f]{64}\..+)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /tuf/ {
        try_files $uri =404;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /targets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Content-addressed APT Acquire-By-Hash indices are immutable by SHA-256 digest.
    location ~ ^/apt/.+/by-hash/SHA256/[0-9a-f]{64}$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /apt/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /rpm/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /bundles/ {
        try_files $uri =404;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
