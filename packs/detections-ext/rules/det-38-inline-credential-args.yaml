title: "Credential in Command-Line Arguments or Approval Memory"
id: 9b13d3f1-4a12-5023-8994-e83441a01b38
status: test
license: "Apache-2.0"
author: "The Guardrails ADR Authors"
description: "Detects inline password CLI flags/env or raw secrets embedded in allow rules (row 38)."
logsource:
  product: grdr
  category: config
  service: any
detection:
  selection_cli:
    exec.inline_password|exists: true
  selection_mem:
    config.change_classes: "secret-in-approval-memory"
  condition: selection_cli or selection_mem
x_grdr:
  row: 38
  origin: official
  rule_id: grdr.det.core.r38.inline-credential-args
  version: "1.0.0"
  finding_class: policy-violation
  ceiling: notify
  stage: K4
  atlas: [T0055]
  owasp_asi: [ASI03]
  mode_default: "none"
  response:
    mode: simulate
    verbs: [capture-evidence]
    max_scope: session
    max_share_bp: 500
  tests:
    positive: fix-38-pos
    negative: fix-38-neg
