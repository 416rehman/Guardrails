title: "Skill Capability Drift or Runtime Remote Fetch"
id: 9b13d3f1-4a12-5023-8994-e83441a01b44
status: test
license: "Apache-2.0"
author: "The Guardrails ADR Authors"
description: "Detects newly added skill capability drift or unprofiled runtime remote fetch attributed to a skill (row 44)."
logsource:
  product: grdr
  category: inventory
  service: any
detection:
  selection_cap:
    skill.capability_added|exists: true
  selection_fetch:
    skill.remote_fetch: "outside-profile"
  condition: selection_cap or selection_fetch
x_grdr:
  row: 44
  origin: official
  rule_id: grdr.det.core.r44.skill-drift-remote-fetch
  version: "1.0.0"
  finding_class: threat
  ceiling: notify
  stage: K2
  atlas: [T0010.005]
  owasp_asi: [ASI04]
  mode_default: "none"
  response:
    mode: simulate
    verbs: [capture-evidence]
    max_scope: session
    max_share_bp: 500
  tests:
    positive: fix-44-pos
    negative: fix-44-neg
