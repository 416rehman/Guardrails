title: "Probing Model-Backed Verdict Provider"
id: 9b13d3f1-4a12-5023-8994-e83441a01b46
status: stable
license: "Apache-2.0"
author: "The Guardrails ADR Authors"
description: "Five model-backed objections in 10 minutes across distinct action digests of one tool class (row 46)."
logsource:
  product: grdr
  category: hook
  service: any
detection:
  selection:
    judge.objection: "true"
  condition: selection
correlation:
  type: event_count
  group-by:
    - root_session_id
    - tool.class
  timespan: 10m
  condition:
    gte: 5
    distinct_field: action.digest
    distinct_gte: 3
x_grdr:
  row: 46
  origin: official
  rule_id: grdr.det.judge-probing
  version: "1.0.0"
  finding_class: tamper
  ceiling: notify
  mode_default: "built-in"
  response:
    mode: simulate
    verbs: [capture-evidence]
    max_scope: session
    max_share_bp: 500
  tests:
    positive: fix-46-pos
    negative: fix-46-neg
