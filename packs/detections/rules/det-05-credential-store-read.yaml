  rule_id: grdr.det.core.r05.credential-store-read
  version: "1.0.0"
  finding_class: policy-violation
  ceiling: notify
  stage: K4
  atlas: [T0083, T0055]
  owasp_asi: [ASI03]
  mode_default: "essentials.cred-store.read (Ask)"
  response:
    mode: simulate
    verbs: [hold-for-grant, capture-evidence]
    max_scope: session
    max_share_bp: 500
  tests:
    positive: fix-05-pos
    negative: fix-05-neg
