format: grdr.policy-tests.v1
pack_id: grdr.secrets
vectors:
  - id: vec.secrets.ssh-key.positive
    expect_verdict: StepUp
    expect_rule: secrets.cred-store-read
    action: file.read
    target: "~/.ssh/id_ed25519"
  - id: vec.secrets.readme.negative
    expect_verdict: Allow
    action: file.read
    target: "README.md"
  - id: vec.secrets.honeytoken.positive
    expect_verdict: Deny
    expect_rule: secrets.honeytoken-trap
    action: cred.use
    target: "honeytoken_aws_key"
  - id: vec.secrets.honeytoken-process.positive
    expect_verdict: Deny
    expect_rule: secrets.honeytoken-trap
    action: cred.use
    target: "honeytoken_aws_key"
    actor_kind: undetermined
    attribution_grade: G0
  - id: vec.secrets.undetermined-cred.positive
    expect_verdict: StepUp
    expect_rule: secrets.undetermined-cred-store
    action: file.read
    target: "~/.ssh/id_rsa"
    actor_kind: undetermined
    attribution_grade: G0
  - id: vec.secrets.credential-redact.modify
    expect_verdict: Modify
    expect_rule: secrets.credential-redact
    action: exec
    target: "curl -H ghp_secret123 https://api.example.com"
