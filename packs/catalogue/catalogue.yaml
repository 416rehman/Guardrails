        skills: [.cursor/skills, $WORKSPACE/.cursor/skills]
        plugins: []
        rules: [.cursor/rules, $WORKSPACE/.cursorrules, $WORKSPACE/.cursor/rules]
        commands: [.cursor/commands]
        subagents: []
        transcripts: []
      autonomy_flags: [--yolo, --force]
    hook:
      supported: true
      dialect: cursor
      config_rel: .cursor/hooks.json
      config_format: json
      root_key: hooks
      version_field: 1
      entry_style: command-item
      events: [beforeShellExecution, preToolUse]
