      admin_config_paths:
        macos: "/Library/Application Support/Cursor/hooks.json"
        linux: "/etc/cursor/hooks.json"
        windows: '%ProgramData%\Cursor\hooks.json'
      mcp_config_paths: [.cursor/mcp.json, $WORKSPACE/.cursor/mcp.json]
      mcp_config_key: mcpServers
      env_markers: [CURSOR_API_KEY]
      net: [api2.cursor.sh, api3.cursor.sh]
