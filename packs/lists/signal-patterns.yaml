format: grdr.policy-lists.v1
pack_id: grdr.lists.signals
lists:
  destructive_patterns:
    - "remove-item -recurse -force"
    - "git reset --hard"
    - "git push --force"
    - "git push -f"
    - "shred "
    - "wipefs "
    - "drop table"
    - "drop database"
    - "truncate -s 0"
  egress_exfil_patterns:
    - "curl "
    - "wget "
    - "invoke-webrequest"
    - "invoke-restmethod"
    - "pastebin"
    - "webhook.site"
    - "transfer.sh"
    - "ngrok"
    - "0x0.st"
    - "169.254.169.254"
    - "fd00:ec2::254"
    - "metadata.google.internal"
  pkg_publish_patterns:
    - "npm publish"
    - "yarn publish"
    - "pnpm publish"
    - "cargo publish"
    - "twine upload"
  cloud_admin_patterns:
    - "iam:createaccesskey"
    - "sts:assumerole"
    - "aws iam"
    - "gcloud auth"
    - "az role"
    - "terraform destroy"
    - "kubectl delete"
  secret_value_patterns:
    - "ghp_"
    - "github_pat_"
    - "sk-ant-"
    - "sk-live-"
    - "sk_live_"
    - "xoxb-"
    - "xoxp-"
    - "aws_access_key_id"
    - "akia"
    - "asia"
    - "aiza"
  extra_control_segments:
    - ".claude"
    - ".claude.json"
    - ".cursor"
    - ".codex"
    - ".gemini"
    - ".windsurf"
    - ".grdr"
    - "grdr-data"
  extra_cred_segments:
    - ".ssh"
    - ".aws"
    - ".gnupg"
    - ".config/gh"
    - ".npmrc"
    - ".pypirc"
    - ".netrc"
    - "id_rsa"
    - "id_ed25519"
    - ".env.production"
  agent_control_risk_patterns:
    - ".claude/"
    - ".claude.json"
    - ".cursor/"
    - ".codex/"
    - ".gemini/"
    - ".windsurf/"
    - ".grdr/"
    - "grdr-data/"
    - "security/"
  credential_risk_patterns:
    - ".ssh/"
    - ".aws/"
    - ".gnupg/"
    - ".config/gh/"
    - "id_rsa"
    - "id_ed25519"
    - ".env.production"
  hook_bypass_risk_patterns:
    - "--dangerously-skip-permissions"
    - "--no-verify"
    - "--disable-hooks"
    - "--no-sandbox"
    - "--disable-sandbox"
    - "--yolo"
    - "grdr_disable"
  destructive_risk_patterns:
    - "rm -rf"
    - "rm -fr"
    - "remove-item -recurse -force"
    - "git reset --hard"
    - "mkfs."
  privilege_escalation_patterns:
    - "sudo "
    - "doas "
    - "runas "
    - "verb runas"
    - "pkexec "
    - "su -"
    - "su root"
    - "start-process -verb=runas"
  message_send_patterns:
    - "slack.com"
    - "discord.com/api/webhooks"
    - "sendmail"
  external_network_risk_patterns:
    - "curl "
    - "invoke-webrequest"
    - "pastebin"
    - "webhook.site"
    - "transfer.sh"
  mcp_write_verbs:
    - "write"
    - "delete"
    - "push"
    - "create"
    - "execute"
  mcp_write_tokens:
    - "write"
    - "delete"
    - "del"
    - "push"
    - "create"
    - "execute"
    - "exec"
    - "shell"
    - "run"
    - "update"
    - "put"
    - "post"
    - "patch"
    - "remove"
    - "rm"
    - "drop"
    - "send"
    - "upload"
    - "publish"
    - "modify"
    - "edit"
    - "set"
    - "add"
    - "append"
    - "insert"
    - "mutate"
    - "apply"
    - "invoke"
    - "trigger"
    - "dispatch"
    - "deploy"
    - "email"
    - "forward"
    - "reply"
    - "merge"
    - "commit"
    - "chmod"
    - "chown"
    - "kill"
    - "eval"
    - "sql"
  mcp_read_tokens:
    - "read"
    - "get"
    - "list"
    - "search"
    - "query"
    - "describe"
    - "inspect"
    - "status"
    - "ping"
    - "version"
    - "fetch"
    - "view"
    - "info"
  bypass_permission_flags:
    - "--dangerously-skip-permissions"
    - "--no-verify"
    - "--yolo"
  hooks_disabled_flags:
    - "--disable-hooks"
  no_sandbox_flags:
    - "--no-sandbox"
    - "--disable-sandbox"
  grdr_disable_flags:
    - "grdr_disable"
  opaque_command_patterns:
    - "$("
    - "`"
    - "-encodedcommand"
    - " -enc "
    - "eval "
    - "invoke-expression"
    - "iex "
    - "frombase64string"
  analyze_opaque_patterns:
    - "$("
    - "`"
    - "-encodedcommand"
    - " -enc"
    - " -ec "
    - " -ec:"
    - " -ec="
    - " /enc"
    - " /ec "
    - " /ec:"
    - " /ec="
    - "eval "
    - "invoke-expression"
    - "iex "
    - "iex("
    - "icm "
    - "invoke-command"
    - "frombase64string"
    - "scriptblock]::create"
    - ".invokescript("
    - ".invoke("
    - "$executioncontext"
  destructive_flag_only_commands:
    - "-rf"
    - "-fr"
    - "rm -rf"
    - "rm -fr"
