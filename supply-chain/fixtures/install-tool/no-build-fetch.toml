# Seeded copies for the no-build-fetch check in .github/actions/install-tool/test_install_tool.py.
# The test writes each `text` to `path` in an empty tree and expects the check to name that path.
# `control` cases are local-only forms the check must pass.

[[case]]
name = "a workflow step that downloads a release asset"
path = ".github/workflows/seeded.yml"
text = """
jobs:
  build:
    steps:
      - run: curl -sSfLO https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-x86_64
"""

[[case]]
name = "the same step in a workflow named *.yaml"
path = ".github/workflows/seeded.yaml"
text = """
jobs:
  build:
    steps:
      - run: curl -sSfLO https://github.com/bufbuild/buf/releases/download/v1.75.0/buf-Linux-x86_64
"""

[[case]]
name = "a buf.gen.yaml with a remote plugin"
path = "proto/buf.gen.yaml"
text = """
version: v2
plugins:
  - remote: example.com/connectrpc/openapi
    out: gen
"""

[[case]]
name = "a buf.yaml with registry deps"
path = "buf.yaml"
text = """
version: v2
deps:
  - example.com/googleapis/googleapis
"""

[[case]]
name = "a build.rs that runs go install of buf"
path = "crates/seeded/build.rs"
text = """
fn main() {
    std::process::Command::new("sh").args(["-c", "go install github.com/bufbuild/buf/cmd/buf@v1.75.0"]).status().ok();
}
"""

[[case]]
name = "a workflow that uses bufbuild/buf-action"
path = ".github/workflows/seeded.yml"
text = """
jobs:
  lint:
    steps:
      - uses: bufbuild/buf-action@v1
"""

[[case]]
name = "a step that logs in to the registry"
path = ".github/actions/seeded/action.yml"
text = """
runs:
  using: composite
  steps:
    - shell: bash
      run: buf registry login
"""

[[control]]
name = "a buf.gen.yaml with a local plugin"
path = "proto/buf.gen.yaml"
text = """
version: v2
plugins:
  - local: protoc-gen-connect-openapi
    out: gen
"""
