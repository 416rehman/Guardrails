# Sources whose text must not flow into our code or content (D-02, design/30 section 1, design/03
# section 13). The fleet's egress and token proxy refuses a request whose host and path match an
# entry and records the attempt as a finding on the work item; agents never fetch, read or copy
# them. People may read an entry to understand a technique, never to copy, translate or
# paraphrase it. Adding an entry is an ordinary change; removing one needs an RFC.
#
# scope "all" covers the whole source; "content" covers only the listed rule trees, so the
# project's specification stays readable. Without `paths` an entry covers the whole repository.

# How a forge repository maps to the hosts and path prefixes the proxy matches.
[forge."github.com"]
hosts = ["github.com", "api.github.com", "raw.githubusercontent.com", "codeload.github.com", "objects.githubusercontent.com"]
path_forms = ["/{repository}", "/repos/{repository}"]

