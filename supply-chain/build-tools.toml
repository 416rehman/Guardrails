# Build and scan tools, pinned by version and, for container images, by digest (design/24
# section 12, team/05 section 3). The workflows read their pins here. Tools are installed and run,
# never linked or redistributed, so a copyleft tool licence is allowed here. `install` is the
# command a session runs to get a missing tool at its pinned version. A tool with an `image` runs
# from that image, and its `install` pulls it.
#
# A tool installed from release assets by .github/actions/install-tool/install_tool.py also has
# `version_flag` (prints its version), `checksums` with `checksums_size` and `checksums_sha256`
# (the release's checksum file), `signature`, `signature_size` and `minisign_key` where the
# release signs that file, and `[tool.<name>.assets]`, one row per platform key with `file`,
# `size`, `sha256`, `binary` (the installed name) and, for an archive, `member` and `member_size`.
# `[install]` holds `timeout_seconds`, the deadline of each download and of each command the
# installer runs; `source_url` and `release_url`, the forms of `source` and of every address the
# installer fetches, with `{repo}`, `{version}` and `{name}` filled in as text, which apply only to
# the tables the installer reads; and `refused_binaries` and `refused_binary_prefixes`: binary
# names the installer refuses because a session could put its `--dest` on PATH, where they would
# shadow the pinned Rust toolchain. A bump of `[tool.buf]` replaces
# supply-chain/fixtures/install-tool/buf-<version>/ with that release's `sha256.txt` and
# `sha256.txt.minisig` in the same change.

[install]
timeout_seconds = 60
source_url = "https://github.com/{repo}"
release_url = "https://github.com/{repo}/releases/download/{version}/{name}"
refused_binaries = ["rustup", "cargo", "rustc", "rustdoc", "rustfmt", "clippy-driver", "miri", "rls"]
refused_binary_prefixes = ["cargo-", "rust-"]

[tool.cargo-deny]
version = "0.22.0"
licence = "MIT OR Apache-2.0"
source = "https://github.com/EmbarkStudios/cargo-deny"
install = "cargo install --locked cargo-deny@0.22.0"

[tool.gitleaks]
version = "8.30.1"
licence = "MIT"
source = "https://github.com/gitleaks/gitleaks"
image = "ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
config = "supply-chain/gitleaks.toml"
install = "docker pull ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"

[tool.zizmor]
version = "1.32.0"
licence = "MIT"
source = "https://github.com/zizmorcore/zizmor"
install = "cargo install --locked zizmor@1.32.0"

# `go` is the Go toolchain that builds the binary, and so its standard library. Its go.mod asks for
# 1.27.3, which GO-2026-6859 affects; 1.27.4 is the first fixed release. `GOTOOLCHAIN` in `install`
# makes the go command fetch and run exactly that toolchain whatever Go the host has. The module
# and the toolchain carry no hash here: the go command checks both against the default checksum
# database, so a session runs it with GOSUMDB at its default and no GONOSUMDB or GOPRIVATE entry
# that matches them.
[tool.osv-scanner]
version = "2.7.1"
licence = "Apache-2.0"
source = "https://github.com/google/osv-scanner"
go = "1.27.4"
install = "env GOTOOLCHAIN=go1.27.4 go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1"

[tool.semgrep]
version = "1.185.0"
licence = "LGPL-2.1-only"
source = "https://github.com/semgrep/semgrep"
image = "semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d"

# Rule sets are read at run time from this commit and never vendored: their licence allows use,
# not redistribution. `severities` are the finding levels that fail the job; the INFO rules of the
# set are audit notes that match every `std::env::args()`, `temp_dir()` and `current_exe()`.
[tool.semgrep-rules]
licence = "LicenseRef-Semgrep-Rules-1.0"
repository = "semgrep/semgrep-rules"
commit = "a5ad1714f00c9f7fde980cab0ea1d6dc6d414fd2"
severities = "WARNING ERROR"

[tool.grype]
version = "v0.121.3"
licence = "Apache-2.0"
source = "https://github.com/anchore/grype"

[tool.cosign]
version = "v3.1.4"
licence = "Apache-2.0"
source = "https://github.com/sigstore/cosign"

[tool.zap]
version = "2.17.0"
licence = "Apache-2.0"
source = "https://github.com/zaproxy/zaproxy"
image = "ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af"

# Run at build time only; never linked, vendored or redistributed (ADR-0032, #1686). Local plugins
# only: no Buf Schema Registry remote plugin, no registry `deps` and no `buf registry login` (P16,
# owner instruction 23), which test_install_tool.py checks over the tracked files.
[tool.buf]
version = "v1.75.0"
licence = "Apache-2.0"
source = "https://github.com/bufbuild/buf"
version_flag = "--version"
checksums = "sha256.txt"
checksums_size = 5312
checksums_sha256 = "b05b543026f48418579c3e37b9c4f9b776b895085e453775ded018a06e631823"
signature = "sha256.txt.minisig"
signature_size = 302
minisign_key = "RWQ/i9xseZwBVE7pEniCNjlNOeeyp4BQgdZDLQcAohxEAH5Uj5DEKjv6"
install = "python3 -I .github/actions/install-tool/install_tool.py buf --dest target/tools/bin"

[tool.buf.assets]
linux-x86_64 = { file = "buf-Linux-x86_64", size = 46764192, sha256 = "fad1e38d6909bbb583a4da81d8c02a01046e2cd663bde7e337dd24277393764b", binary = "buf" }
macos-arm64 = { file = "buf-Darwin-arm64", size = 45408338, sha256 = "f71b009ebd8530b12fd85b060c6c245e15d6e5110ccc8da48d8b6fa71e59330b", binary = "buf" }
windows-x86_64 = { file = "buf-Windows-x86_64.exe", size = 47835648, sha256 = "de35b288e7962ac72aefee5048aff80551a4f0e6ac865a21f838693461ac8b8d", binary = "buf.exe" }

# Run at build time only, as buf's local plugin; never linked, vendored or redistributed (ADR-0032,
# #1686). The release publishes no signature, so the pinned digests are the only check. The
# repository moved from sudorandom/ and is pinned at its connectrpc/ name only.
[tool.protoc-gen-connect-openapi]
version = "v0.30.0"
licence = "MIT"
source = "https://github.com/connectrpc/protoc-gen-connect-openapi"
version_flag = "--version"
checksums = "checksums.txt"
checksums_size = 598
checksums_sha256 = "a9eaffa3f358866cd2e8eaf6f5c7f756e808dc8e82460f7ffca230047fbe6841"
install = "python3 -I .github/actions/install-tool/install_tool.py protoc-gen-connect-openapi --dest target/tools/bin"

[tool.protoc-gen-connect-openapi.assets]
