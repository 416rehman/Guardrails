# Maintainers are the crates.io owners; the registry check is the name and checksum in the
# crates.io index (research/h09).
[[admission.justification]]
crate = "cargo_metadata"
purpose = "grdr-archlint reads the workspace graph from `cargo metadata` into typed packages, targets and dependency kinds (#1580)"
why_not_std = "std parses no JSON, and no workspace crate models Cargo's metadata format, which changes with Cargo releases"
maintainers = ["oli-obk"]
maintainer_risk = "one owner account; it reaches only grdr-archlint, a tool crate no shipped crate may depend on (ARCH-001, #1580)"
unsafe = "none: no `unsafe` in its sources"
build_script = "none"
proc_macro = "none"
licence = "MIT"
registry_check = "present in the crates.io index at the recorded checksum, not yanked"

[[admission.justification]]
crate = "toml"
purpose = "grdr-archlint reads architecture.toml (#1580); the grdr-schema test generators read schema/codes (#278, #279)"
why_not_std = "std parses no TOML and no admitted crate does; Cargo itself depends on this crate"
maintainers = ["epage", "github:toml-rs:maintainers"]
unsafe = "none: `#![forbid(unsafe_code)]` at the crate root"
build_script = "none"
proc_macro = "none"
licence = "MIT OR Apache-2.0"
registry_check = "present in the crates.io index at the recorded checksum, not yanked"

[[admission.justification]]
crate = "serde"
purpose = "derives Deserialize for the models of architecture.toml and schema/codes that toml and cargo_metadata deserialise into"
why_not_std = "std has no deserialisation framework, and toml and cargo_metadata already bring serde, so the direct use adds no crate"
maintainers = ["dtolnay", "github:serde-rs:publish"]
unsafe = "two blocks, both `str::from_utf8_unchecked` (src/core/format.rs:16, src/core/ser/impls.rs:821)"
build_script = "build.rs runs `$RUSTC --version` and writes OUT_DIR/private.rs"
proc_macro = "serde_derive, through the `derive` feature"
licence = "MIT OR Apache-2.0"
registry_check = "present in the crates.io index at the recorded checksum, not yanked"
