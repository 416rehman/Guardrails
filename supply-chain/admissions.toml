# Registry crates admitted before their first consumer adds them to Cargo.lock, with the closure
# they bring (design/24 section 12, team/05 section 9). Each crate row is the name, version,
# licence expression and crates.io checksum the consumer's lockfile entry must match. Every
# expression here is satisfied by the permissive class of licences.toml alone. The cargo-vet
# store of #1801 takes over these audits once it exists; until then eval-licence and
# eval-security read this file.
# A row published inside the cooldown of design/35 section 2.6 carries `not_before`, the publish
# time plus the cooldown. No consumer may add that row to Cargo.lock before its `not_before`.
# The justification fields are those design/35 section 2.6 lists; it names no keys, so the keys
# are plain words for them.

[[admission]]
issue = 1575
crates = ["cargo_metadata", "toml", "serde"]
consumers = [
  { crate = "grdr-archlint", kind = "normal", issue = 1580 },
  { crate = "grdr-schema", kind = "dev", only = ["toml", "serde"], issue = 278 },
]
resolver = "cargo 1.99.1, resolver 3, default features"
checked = [
  "cargo-deny 0.22.0 check licenses advisories bans sources with deny.toml: exit 0",
  "RustSec advisory-db commit 55e1c3dfbd834237a05bbbf7b50ba3b5be27b662: no advisory",
  "OSV querybatch, crates.io ecosystem: no id for any row",
  "crates.io sparse index: every checksum matches, no row yanked",
]
# Build-time code in grdr-archlint's graph, serde's `derive` feature included. grdr-schema's dev
# graph runs the build scripts of proc-macro2, quote, serde and serde_core and the serde_derive
# proc macro. No build script does more than read Cargo's environment, run $RUSTC or its wrappers
# for version and compile probes, and write under OUT_DIR. The proc macros are not audited line
# by line.
build_scripts = ["camino", "proc-macro2", "quote", "serde", "serde_core", "serde_json", "thiserror", "zmij"]
proc_macros = ["serde_derive", "thiserror-impl"]
# indexmap, hashbrown and equivalent are in the lockfile only through toml's optional
