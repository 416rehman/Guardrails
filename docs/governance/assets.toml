# Guardrails ADR Covenant Asset Register (D-03, docs/design/30 section 13)
schema = "grdr.assets.v1"
steward = "Loonaro"
project_name = "Guardrails ADR"
namespace = "grdr"

[[asset]]
id = "asset.domain.primary"
category = "domain"
identifier = "guardrailshq.com"
custodian = "Loonaro"
transfer_mechanism = "registrar_transfer_via_escrow_L06"
