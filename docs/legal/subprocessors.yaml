# Guardrails ADR Sub-Processor Register (docs/design/36 section 5)
# Standalone and self-hosted deployments transmit zero data to Loonaro.
# Hosted SaaS sub-processor changes require 30 days' advance notice prior to effective_from.
schema: grdr.subprocessors.v1
notice_period_days: 30
standalone_selfhosted_external_subprocessors: false

subprocessors: []
