# Implementers (team/02 section 5) and the twelve independent evaluators (team/02 section 6).
# Models and effort: team/02 and design/_review/03. cap_role and max_turns: team/01 section 9.
# The dispatcher, not the roster, runs a worker on opus for a trust-core path or a high-tier
# change, and starts eval-diff on the model that did not write the change.
# Evaluators have the Write tool for their drafts under .agent/state/; guard-path refuses them
# every other path outside the write set they list. The verdict reaches kit handoff as a draft
# file, since dontAsk refuses a here-document that carries JSON.
# Implementers take their usage cap from cap_role in .agents/kit/usage.toml. Evaluators run on
# every pull request without a person starting them (usage.toml routines review, eval-tier and
# eval-by-kind), so each carries usage_cap, per run and round.
# Every implementer preloads grdr-structure and cleanup (owner instruction 4) and
# grdr-vendor-research (owner instruction 14); every writer and reviewer of a screen preloads
# ui-architect, then grdr-interface (P17), and impl-web, eval-ux and the screen-reviewing persona
# seats add the Modern Web Guidance skills after them (owner instruction 18).

[agent.impl-rust]
group = "implementer"
description = "Implements exactly one leased work item, a GitHub issue, in the Rust crates, programs and xtask/src of the item's squad. Use only from the dispatcher with an issue number."
model = "sonnet"
effort = "high"
cap_role = "worker"
max_turns = 80   # sizes XS and S; the launcher passes 150 for size M
tools = ["Read", "Grep", "Glob", "Edit", "Write", "Bash", "Skill", "LSP"]
disallowed_tools = ["Agent", "PowerShell"]
# The first three globs are team/02 section 1.2; the rest are the components team/02 section 9
# gives impl-rust, plus fuzz targets. The issue's write set narrows them further.
write = [
  "crates/**", "programs/**", "xtask/src/**",
  "proto/**", "schema/**", "buf.yaml", "buf.gen.yaml",
  "lab/**", "sdk/**", "conformance/**", "deploy/**", "platform/windows/**", "fuzz/**",
]
deny_write = "@protected"
net = "A"
skills = [
  "grdr-start-item", "grdr-verify", "grdr-fix-bug", "grdr-remove-code", "grdr-handoff",
  "grdr-structure", "cleanup:cleanup", "grdr-vendor-research", "anthropic-skills:write-like-a-normal-staff-senior-developer",
]
trigger = "dispatch"
body = "templates/agents/impl-rust.md"

