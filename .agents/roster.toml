# Gardeners (team/02 section 7, the intake triager included), the persona council (section 8)
# and the operations agents (section 7.1). Models and effort: team/02 and design/_review/03.
# cap_role names a row of team/01 section 9: "gardener" (60 turns), "council" (20 turns).
# Operations agents have no row of their own; team/01 section 9 gives other recurring agents the
# row for their role, and the gardener row is the recurring-agent row they match.
#
# Work items are GitHub issues in the main repository (owner instruction 5). A gardener's
# scheduled run is a find run: it files status:proposed issues and changes nothing. Gardeners
# that make pull requests do so only in a fix run, on a status:ready issue labelled
# agent:<their name> that the dispatcher leased to them, so the readying lead, never the
# gardener, writes the acceptance criteria (owner instruction 6).
#
# usage_cap is a share of the subscription's usage window per run, a target until S-20
# (WI-0032) measures it. Council seats run per design issue, not on a cadence, so they carry
# none. Gardener audit runs are also bounded by the token caps in .agents/kit/usage.toml.

# Gardeners. Find passes run on sonnet; every refuting pass runs on opus, started by the
# dispatcher or the audit runner, never by the gardener.

