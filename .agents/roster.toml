# The agent roster (team/02 section 1.2): one [defaults] table, then one [agent.<name>] table per
# agent in team/02 order. kit render turns each into .claude/agents/<name>.md.
#
# A role whose skills include grdr-vendor-research (the product lead, the chief architect, every
# lead, implementer and evaluator, and garden-intel) gets WebFetch and WebSearch from kit render,
# with fetch rules for the domains of .agents/kit/vendors.toml (owner instruction 14), so its
# entry neither lists nor disallows them. No other role may list WebSearch. The repository the
# work items live in is harness.toml [github] repository.

# The direction group and the 18 domain leads (team/02 sections 3 and 4), with work items as
# GitHub issues (owner instructions 5 and 6). cap_role names a row of team/01 section 9.
# Planners write no repository files: their output is issues, labels and comments through gh,
# which guard-command limits per role, so only the chief architect has a write set. The other
# planners have the Write tool with an empty write set, which guard-path holds to their drafts
# under .agent/state/, so an issue body or hand-off longer than a Bash command may be goes to
# gh and kit handoff as a draft file.

# Commits are one Conventional Commit line with no trailers; the pull request body carries
# Closes #<item> and the metadata block (owner instruction 27).
[defaults]
handoff = "issue-comment"                        # handoff.v1 in a collapsed section on the item's issue
item_snapshot = ".agent/state/item-{item}.json"  # written by kit launch from the issue; hooks read it
branch = "agent/{item}/a{attempt}"

[agent.chief-architect]
group = "direction"
description = "Owns the decision spine, layer rules and RFCs. Use for architecture questions, RFC drafting and resolving lead conflicts. Never writes code."
model = "fable"
effort = "xhigh"
cap_role = "direction"
max_turns = 60
tools = ["Read", "Grep", "Glob", "Write", "Edit", "WebFetch", "Skill", "Bash", "Workflow"]
disallowed_tools = ["PowerShell", "NotebookEdit", "Agent"]
write = ["rfcs/**", "docs/decisions/**", "docs/agents/status/**"]
deny_write = "@protected"
net = "B"
skills = ["grdr-write-spec", "grdr-handoff", "grdr-vendor-research", "anthropic-skills:write-like-a-normal-staff-senior-developer"]
trigger = "manual"
body = "templates/agents/chief-architect.md"

