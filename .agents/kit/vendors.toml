# What the skill grdr-vendor-research reads when a feature's requirements, completeness or industry
# norm are unclear (owner instruction 14): the reference vendors, each with its documentation
# domains and the brief under docs/references/research/ that covers it, then the source classes
# of the horizon sweep, each with its domains and the URLs a sweep starts from.
#
# kit render turns every domain here into a WebFetch(domain:<d>) allow rule and adds WebSearch
# for the roles whose roster skills include [research] skill; every other role keeps WebSearch
# out of its tools. The same domains join the egress lists [research] egress_lists names, and
# each granted role's entry in deploy/fleet/egress.json. A domain is an exact host; `*.` before a
# host covers its subdomains, never the host itself. kit check validates the file. Add a vendor
# or a source class here; nothing in code names one. A vendor's optional `aliases` are the short
# forms code would write; check S7 looks for its `name` and each alias.

[research]
skill = "grdr-vendor-research"
egress_lists = ["intel"]

# The reference vendors the owner named, briefs 01 to 05.

[vendor.origin]
name = "Origin"
domains = ["www.originhq.com", "docs.originhq.com"]
brief = "docs/references/research/01-origin.md"

[vendor.beyondtrust]
name = "BeyondTrust AI Agent Security"
aliases = ["BeyondTrust"]
domains = ["docs.beyondtrust.com", "www.beyondtrust.com"]
brief = "docs/references/research/02-beyondtrust.md"

[vendor.microsoft]
name = "Microsoft Agent 365 and the Microsoft agent governance stack"
aliases = ["Agent 365"]
domains = ["learn.microsoft.com", "www.microsoft.com", "blogs.windows.com", "docs.github.com"]
brief = "docs/references/research/03-microsoft.md"

[vendor.crowdstrike]
name = "CrowdStrike Falcon AIDR"
aliases = ["CrowdStrike", "Falcon"]
domains = ["aidr-docs.crowdstrike.com", "developer.crowdstrike.com", "www.crowdstrike.com", "pangea.cloud"]
brief = "docs/references/research/04-crowdstrike.md"

[vendor.sidekick]
name = "Sidekick Security"
domains = ["sidekicksecurity.ai"]
brief = "docs/references/research/05-sidekick.md"

