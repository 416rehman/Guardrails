# Agents (worker, evaluator, gardener identities) may not create, modify or delete these.
# Read by: worker VM mount profile, PreToolUse hook (advisory), CI gate V05 (enforcing).
# Contents and order: team/05 section 5, without acceptance/**: acceptance criteria live in the
# work-item issue, held by the ready.v1 digest (owner instruction 5). The kit binary every hook
# runs is built from xtask/src/hook, kit and config and xtask/Cargo.toml, so they are protected
# beside the gates. quality/hardcoded-exemptions.toml (S7) is under quality/**, every bound of
# .agents/kit/limits.toml under .agents/**, and the brand manifest under brand/**. The Astryx
# exception registry (owner instruction 21) and the release-please files (owner instruction 3)
# change only through their own protected-change items. The chief architect's RFCs and status
# notes are here beside its decision records, so its whole write set lands the one way its shell
# allows: a protected-change lease, which makes it the item's implementer (owner instructions 5
# and 7). A protected change is its own work item under GRDR_SCOPE=protected, landed after its
# evaluators pass (owner instruction 7).
