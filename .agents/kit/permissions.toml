# Project-scope permissions, sandbox and settings for .claude/settings.json (team/03 sections 4
# and 8). Keys honoured only from managed or user settings (strictKnownMarketplaces,
# allowManagedPermissionRulesOnly, allowManagedHooksOnly, sandbox.network.strictAllowlist,
# telemetry exporters) live in deploy/fleet/managed-settings.json instead.

# One file serves every role, so a rule here is the union of what the roles need. Each role stays
# bounded by its definition's tools list, guard-path (paths: write set, seed scope or roster write
# globs), guard-command (each role's shell and gh calls) and these deny rules. There is no Edit
# allow rule on purpose: guard-path approves a file-tool write inside the agent's scope with
# permissionDecision allow, and an Edit allow rule would also pre-approve every shell redirect,
# whose targets guard-command checks against protected paths and kit state but not the write set.
# A rule may name {repository} (harness.toml [github] repository) and {marketplace}
# (marketplace.toml [marketplace] name), and kit render adds Workflow(<name>) for every kit
# workflow. kit launch runs every session in dontAsk, so what no rule or hook approves is refused.
[permissions]
default_mode = "default"
disable_bypass = "disable"
# kit render adds one Edit deny rule per entry of protected-paths.toml. No hook decision overrides
# a deny rule, so a widened session (the seed, a protected-change lease) writes its protected
# paths through `cargo xtask kit place`, a subprocess these rules do not see, which holds it to
# the same scope guard-path does. The issue snapshot and the kit binary sit in git-ignored
# .agent/, outside that list, and the hooks trust both.
deny = [
  "Edit(./.git/**)", "Edit(./.agent/kit/**)", "Edit(./.agent/state/item-*.json)",
  "Read(./.env)", "Read(./**/*.pem)", "Read(~/.ssh/**)", "Read(~/.aws/**)", "Read(~/.config/gh/**)",
  "Read(~/AppData/Roaming/GitHub CLI/**)",
  "Read(~/.cargo/credentials.toml)", "Read(~/.npmrc)", "Read(~/.claude/.credentials.json)",
  "Read(~/.claude/settings.json)", "Read(~/.claude/settings.local.json)", "Read(~/.claude.json)",
  "Bash(git push --force *)", "Bash(git push -f *)", "Bash(git reset --hard *)",
  "Bash(git commit --no-verify *)", "Bash(git commit -s *)", "Bash(git commit --signoff *)",
  # guard-command reads `gh release list` and `view` as reads (garden-deps needs both).
  "Bash(gh pr merge *)", "Bash(gh release create *)", "Bash(gh release edit *)",
  "Bash(gh release delete *)", "Bash(gh release delete-asset *)", "Bash(gh release upload *)",
  "Bash(gh release download *)", "Bash(cargo publish *)", "Bash(npm publish *)",
  "Bash(pnpm publish *)", "Bash(cargo insta accept *)", "Bash(cargo insta review *)",
  "Bash(gh auth *)", "Bash(gh secret *)", "Bash(gh variable *)", "Bash(gh extension *)",
  "Bash(gh gist *)", "Bash(gh ssh-key *)", "Bash(gh gpg-key *)", "Bash(gh config set *)",
  "Bash(gh repo create *)", "Bash(gh repo edit *)", "Bash(gh repo delete *)",
  "Bash(gh repo rename *)", "Bash(gh repo archive *)",
  "Bash(gh issue delete *)", "Bash(gh issue transfer *)",
  "Bash(gh label create *)", "Bash(gh label edit *)", "Bash(gh label delete *)",
  "Bash(gh label clone *)",
]
# No bare WebFetch or WebSearch rule here or in deny: it would shadow the WebFetch(domain:<d>)
# and WebSearch allow rules kit render adds from .agents/kit/vendors.toml (owner instruction 14).
# Only the roles that load its research skill carry those tools; for any other fetch Claude Code
# still asks, and dontAsk sessions refuse it. No `gh api` rule here either: an ask rule beats
# every allow rule, so it would refuse the evaluators' verdict posts allowed below.
ask = [
  "Bash(cargo add *)", "Bash(cargo install *)", "Bash(pnpm add *)",
]
# Agents file, triage and ready issues themselves (owner instruction 6), so the gh issue verbs
# are allowed here and guard-command narrows them per role: implementers comment and create
# status:proposed issues; leads, the product lead and the programme manager also edit and
# close as not planned; nobody closes an issue as completed, the merged pull request does.
allow = [
  "Bash(cargo xtask *)", "Bash(cargo check *)", "Bash(cargo build *)", "Bash(cargo nextest *)",
  "Bash(cargo test *)", "Bash(cargo clippy *)", "Bash(cargo fmt *)",
  # A package's scripts run from its own directory, or with -r for every package: a * before
  # `run` would also approve any pnpm option written there.
  "Bash(pnpm run *)", "Bash(pnpm -r run *)",
  "Bash(git status *)", "Bash(git diff *)", "Bash(git log *)", "Bash(git show *)", "Bash(git add *)",
  "Bash(git commit -m *)",
  "Bash(gh issue view *)", "Bash(gh issue list *)", "Bash(gh issue create *)",
  "Bash(gh issue comment *)", "Bash(gh issue edit *)", "Bash(gh issue close *)",
  "Bash(gh search issues *)", "Bash(gh label list *)", "Bash(gh repo view *)",
  "Bash(gh pr view *)", "Bash(gh pr diff *)", "Bash(gh pr list *)", "Bash(gh pr checks *)",
  "Bash(gh pr comment *)",
  # Gardeners open static-lane pull requests from their own branch, and post-bash names a git
  # revert; guard-command keeps each to the session's own branch and role.
  "Bash(git push *)", "Bash(gh pr create *)", "Bash(gh pr edit *)",
  "Bash(git checkout HEAD -- *)", "Bash(git checkout -- *)", "Bash(git restore *)",
  "Bash(cargo update *)",
  # Leads plan against the workspace graph; garden-deps reads upstream releases and CI runs, which
  # guard-command reads as reads; the review workflow fetches the pull request's commits.
  "Bash(cargo metadata *)", "Bash(gh release list *)", "Bash(gh release view *)",
  "Bash(gh run list *)", "Bash(gh run view *)", "Bash(git fetch origin *)",
  # eval-api's contract checks and eval-licence's licence checks; cargo vet only checks, since its
  # other subcommands rewrite supply-chain/. garden-tests' scoped mutation run. guard-command
  # treats both tools' output options as writes and refuses `cargo mutants --in-place`.
  "Bash(buf lint *)", "Bash(buf breaking *)", "Bash(cargo semver-checks *)",
  "Bash(cargo deny check *)", "Bash(cargo vet --locked)", "Bash(cargo vet --locked check *)",
  "Bash(pnpm licenses list *)", "Bash(cargo mutants *)",
  # The pnpm form owner instruction 24 names instead of npm ci. There is no `pnpm exec` rule: it
  # runs any program, so a package's tools run through its scripts (`pnpm run`), which only a
  # lead's item changes, and guard-command refuses `pnpm exec` and `pnpm dlx` to agents.
  "Bash(pnpm install --frozen-lockfile *)",
  # The evaluator's verdict: a check run, or a commit status where check runs need an App.
  # guard-command allows these to evaluators only, on this repository, under their own context.
  "Bash(gh api --method POST repos/{repository}/check-runs *)",
  "Bash(gh api --method PATCH repos/{repository}/check-runs/*)",
  "Bash(gh api --method POST repos/{repository}/statuses/*)",
  # Logs an agent appends to from the shell: an implementer's predictions (skill grdr-start-item)
  # and an evaluator's expectations (skill grdr-evaluate). guard-path and guard-command treat both
  # as the agent's own drafts. Every other write goes through a file tool, which guard-path approves.
  "Edit(./.agent/state/expect-*)", "Edit(./.agent/evidence/expectations-*.jsonl)",
  # The installed plugins' own files, such as the modern-web-guidance guides that guard-command
  # names instead of the package's CLI (owner instruction 18).
  "Read(~/.claude/plugins/cache/{marketplace}/**)",
  # team/03 K8's browser driver for impl-web and the UI evaluators, once its server is configured.
  "mcp__playwright__*",
]

# failIfUnavailable stays unset: native Windows has no sandbox, and the fleet's managed
# settings turn it on where one exists.
[sandbox]
enabled = true
allow_unsandboxed_commands = false
deny_read = ["~/.ssh", "~/.aws", "~/.config/gh"]
allowed_domains = [
  "crates.io", "index.crates.io", "static.crates.io", "docs.rs", "registry.npmjs.org",
  "github.com", "api.github.com", "codeload.github.com", "buf.build",
]

[settings]
schema = "https://json.schemastore.org/claude-code-settings.json"
model = "claude-sonnet-5-5"
available_models = ["opus", "sonnet", "fable"]
auto_memory = false
attribution_commit = ""
attribution_pr = ""
disable_workflows = false
disable_auto_mode = "disable"

# kit render adds GH_REPO from harness.toml [github] repository and ANTHROPIC_DEFAULT_HAIKU_MODEL
# from models.toml folded_aliases, here and in every managed document's env.
[settings.env]
GRDR_KIT = "1"
CARGO_TERM_COLOR = "never"
CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS = "4"
CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS = "3"
GH_PROMPT_DISABLED = "1"
GH_NO_UPDATE_NOTIFIER = "1"
DISABLE_TELEMETRY = "1"            # owner instruction 18; the Modern Web Guidance CLI honours it too
SEMGREP_GUARDIAN_AUTO_UPDATE = "0" # Guardian keeps its pinned hook binaries (.agents/marketplace/PINS.md)
ENABLE_CODE_SECURITY_REVIEW = "0"  # security-guidance keeps its edit warnings, runs no model review (owner instruction 8)

# Managed settings for the fleet container (team/03 section 8), one document per roster group in
# Claude Code's own key names. kit render merges in the protected-path Edit deny rules, the
# vendors.toml fetch and search rules where a role of the group loads the research skill, and the
# derived env, and writes deploy/fleet/managed-settings.json (implementer) and
# managed-settings.<group>.json. dontAsk refuses every fetch those rules do not allow.
# guard-command narrows the gh rules to each role's calls.
[managed.implementer]
disableAutoMode = "disable"
allowManagedPermissionRulesOnly = true
strictKnownMarketplaces = [{ source = "pathPattern", pathPattern = '(^|/)\.agents/marketplace/?$' }]
autoMemoryEnabled = false

[managed.implementer.permissions]
defaultMode = "dontAsk"
disableBypassPermissionsMode = "disable"
deny = [
  "Bash(gh pr merge *)", "Bash(git push --force *)", "Bash(git push -f *)",
  "Bash(cargo publish *)", "Bash(cargo add *)", "Bash(cargo install *)", "Bash(pnpm add *)",
]
allow = [
  "Bash(cargo xtask *)", "Bash(cargo check *)", "Bash(cargo build *)", "Bash(cargo nextest *)",
  "Bash(cargo clippy *)", "Bash(cargo fmt *)", "Bash(pnpm run *)", "Bash(pnpm -r run *)",
  "Bash(git status *)", "Bash(git diff *)", "Bash(git log *)", "Bash(git add *)",
  "Bash(git commit -m *)", "Bash(gh issue *)", "Bash(gh pr view *)",
  "Bash(gh pr create *)", "Bash(gh pr edit *)", "Bash(gh pr comment *)",
  "Bash(pnpm install --frozen-lockfile *)",
  "Edit(./.agent/state/expect-*)", "Read(~/.claude/plugins/cache/{marketplace}/**)",
  "mcp__playwright__*",
]

[managed.implementer.sandbox]
enabled = true
failIfUnavailable = true
allowUnsandboxedCommands = false

[managed.implementer.sandbox.network]
allowedDomains = [
  "crates.io", "index.crates.io", "static.crates.io", "docs.rs", "registry.npmjs.org",
  "github.com", "api.github.com", "codeload.github.com",
]
strictAllowlist = true

[managed.implementer.env]
CLAUDE_CODE_ENABLE_TELEMETRY = "1"
OTEL_LOGS_EXPORTER = "otlp"
OTEL_METRICS_EXPORTER = "otlp"
OTEL_EXPORTER_OTLP_ENDPOINT = "http://127.0.0.1:4318"
CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS = "4"
CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS = "3"
DISABLE_TELEMETRY = "1"
GH_PROMPT_DISABLED = "1"

# Evaluators: the implementer document with every Edit denied and no git add or commit; gh api
# posts their commit statuses until the evaluator App can post check runs.
[managed.evaluator]
disableAutoMode = "disable"
allowManagedPermissionRulesOnly = true
strictKnownMarketplaces = [{ source = "pathPattern", pathPattern = '(^|/)\.agents/marketplace/?$' }]
autoMemoryEnabled = false

[managed.evaluator.permissions]
defaultMode = "dontAsk"
disableBypassPermissionsMode = "disable"
deny = [
  "Edit", "Write", "NotebookEdit", "Bash(gh pr merge *)",
  "Bash(git push *)", "Bash(git commit *)", "Bash(cargo publish *)", "Bash(cargo add *)",
  "Bash(cargo install *)", "Bash(pnpm add *)",
]
allow = [
  "Bash(cargo xtask *)", "Bash(cargo check *)", "Bash(cargo build *)", "Bash(cargo nextest *)",
  "Bash(cargo clippy *)", "Bash(cargo fmt *)", "Bash(pnpm run *)", "Bash(pnpm -r run *)",
  "Bash(git status *)", "Bash(git diff *)", "Bash(git log *)", "Bash(git show *)",
  "Bash(git fetch *)", "Bash(git worktree *)", "Bash(gh issue *)", "Bash(gh pr view *)",
  "Bash(gh pr diff *)", "Bash(gh pr checks *)", "Bash(gh pr comment *)", "Bash(gh api *)",
  "Bash(buf lint *)", "Bash(buf breaking *)", "Bash(cargo semver-checks *)",
  "Bash(cargo deny check *)", "Bash(cargo vet --locked)", "Bash(cargo vet --locked check *)",
  "Bash(pnpm licenses list *)", "mcp__playwright__*",
]

[managed.evaluator.sandbox]
enabled = true
failIfUnavailable = true
allowUnsandboxedCommands = false

[managed.evaluator.sandbox.network]
allowedDomains = [
  "crates.io", "index.crates.io", "static.crates.io", "docs.rs", "registry.npmjs.org",
  "github.com", "api.github.com", "codeload.github.com",
]
strictAllowlist = true

[managed.evaluator.env]
CLAUDE_CODE_ENABLE_TELEMETRY = "1"
OTEL_LOGS_EXPORTER = "otlp"
OTEL_METRICS_EXPORTER = "otlp"
OTEL_EXPORTER_OTLP_ENDPOINT = "http://127.0.0.1:4318"
CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS = "4"
CLAUDE_CODE_WORKFLOW_MAX_CONCURRENT_AGENTS = "3"
DISABLE_TELEMETRY = "1"
GH_PROMPT_DISABLED = "1"
