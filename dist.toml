# Guardrails ADR Distribution Registry (D-58, D-66, P14, P16, docs/design/22, 24, 26)
# Single source of truth for release origins, trust roots, OCI registries, and update sources.
schema = "grdr.dist.v1alpha1"
brand_manifest = "brand/brand.toml"
channel_default = "broad"
phone_home = false

[endpoints]
release_origin = "https://github.com/416rehman/Guardrails/releases/download"
tuf_metadata_origin = "https://416rehman.github.io/Guardrails/tuf"
mirror_cdn_origin = "https://cdn.jsdelivr.net/gh/416rehman/Guardrails@tuf"
docs_origin = "https://docs.guardrailshq.com"
status_origin = "https://status.guardrailshq.com"
enrol_origin = ""
telemetry_origin = ""

[registries]
container = "ghcr.io/416rehman"
helm_oci = "oci://ghcr.io/416rehman/charts"
crate = "https://crates.io"
apt = "https://416rehman.github.io/Guardrails/apt"
rpm = "https://416rehman.github.io/Guardrails/rpm"
winget = "Loonaro.GuardrailsADR"
homebrew_tap = "416rehman/guardrails"

[trust]
mode = "tuf"
initial_root_path = "release/tuf/1.root.json"
trusted_root_path = "release/sigstore/trusted_root.json"
require_slsa_provenance = true
require_platform_signature = false
signature_algorithms = ["ecdsa-p256-sha256", "ed25519"]
post_quantum_hybrid_ready = true

[updates]
default_authority = "self"
authorities = ["self", "managed", "image"]
default_policy = "auto-patch"
mirror_lag_hours = 48
timestamp_max_stale_s = 300

[[updates.sources]]
id = "project-github-pages"
role = "metadata"
uri = "https://416rehman.github.io/Guardrails/tuf"
priority = 10
immutable_cache = true

[[updates.sources]]
id = "project-github-releases"
role = "targets"
uri = "https://github.com/416rehman/Guardrails/releases/download"
priority = 20
immutable_cache = true

[[updates.sources]]
id = "project-jsdelivr-mirror"
role = "mirror"
uri = "https://cdn.jsdelivr.net/gh/416rehman/Guardrails@tuf"
priority = 30
immutable_cache = true

[signing]
sigstore_oidc_issuer = "https://token.actions.githubusercontent.com"
workflow_repository = "416rehman/Guardrails"
dsse_payload_type = "application/vnd.guardrails.pack+json"

[links]
release_manifest_schema = "release/release-manifest.schema.json"
compatibility_matrix = "support.toml"
limits = "limits.toml"
airgap_supported = true

[adapters]
tier1 = [
  "grdr-store-local",
  "grdr-rel-sqlite",
  "grdr-rel-postgres",
  "grdr-bus-log",
  "grdr-bus-nats",
  "grdr-lake",
  "grdr-sensor-linux",
  "grdr-sensor-macos",
  "grdr-sensor-windows",
]
contrib_policy = "tier2-testkit-verified"
